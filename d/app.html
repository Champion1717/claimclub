<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claimclub · Your claims</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>if(innerWidth<820)location.replace('../m/app.html')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
button{font-family:inherit;border:0;cursor:pointer}
.scroll{scrollbar-width:thin;scrollbar-color:#C9D3CD transparent}.scroll::-webkit-scrollbar{width:8px;height:8px}.scroll::-webkit-scrollbar-thumb{background:var(--bg-C9D3CD,#C9D3CD);border-radius:99px}.scroll::-webkit-scrollbar-track{background:transparent}
button:focus-visible{outline:3px solid #3DDC97;outline-offset:2px}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.35);border-top-color:#FFFFFF;animation:spin .7s linear infinite}
@keyframes noteIn{0%{opacity:0;transform:translateY(18px) scale(.96)}60%{opacity:1;transform:translateY(-2px) scale(1.01)}100%{opacity:1;transform:none}}
.note{animation:noteIn .45s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes chk{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
.note .ck path{stroke-dasharray:24;animation:chk .45s ease .25s both}
@keyframes ring{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.2);opacity:0}}
.note .rg{animation:ring .9s ease-out .15s both}
@keyframes pop{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:1}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(1)}}
.note .cf{position:absolute;left:30px;top:30px;width:6px;height:6px;border-radius:2px;animation:pop .9s cubic-bezier(.2,.8,.3,1) .2s both}
@keyframes justIn{0%{background:var(--bg-D9F5E7,#D9F5E7);transform:translateY(-6px);opacity:0}30%{opacity:1;transform:none}100%{background:var(--bg-FFFFFF,#FFFFFF)}}
.just{animation:justIn 1.6s ease both}
@keyframes cardIn{0%{opacity:0;transform:translateY(-10px) scale(.97)}100%{opacity:1;transform:none}}
.cardin{animation:cardIn .45s cubic-bezier(.2,.9,.3,1.2) both}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important;animation-iteration-count:1 !important}}
.stepTxt{display:none}
.srow{display:grid;grid-template-columns:34px minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 16px}
.z-s>aside,.z-s>header,.z-s>nav,.z-s .zwrap,.z-s .shCard,.z-s .note{zoom:.86}.z-l>aside,.z-l>header,.z-l>nav,.z-l .zwrap,.z-l .shCard,.z-l .note{zoom:1.14}
@media (max-width:1100px){.srow{grid-template-columns:34px minmax(0,1fr) auto}.srow>.hideS{display:none !important}.igrid{grid-template-columns:minmax(0,1fr) !important}}
@keyframes shFade{from{opacity:0}}@keyframes shPop{from{opacity:0;transform:translateY(18px) scale(.98)}}
.arow{display:grid;grid-template-columns:34px minmax(0,1.6fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:9px 12px;background:var(--bg-FFFFFF,#FFFFFF);border-radius:16px}
.trow{display:grid;grid-template-columns:34px minmax(0,1.4fr) minmax(0,1.4fr) 96px;gap:14px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln-E7EBF3,#E7EBF3)}
.sgrid{display:grid;grid-template-columns:1fr 1fr;column-gap:28px}
@media (max-width:1100px){.arow{grid-template-columns:34px minmax(0,1fr) auto}.arow>.hideS{display:none !important}.trow{grid-template-columns:34px minmax(0,1fr) auto}.trow>.hideS{display:none}.sgrid{grid-template-columns:1fr}.setupTop{grid-template-columns:1fr !important}}
.arow .spin{border-color:rgba(10,15,13,.25);border-top-color:#0A0F0D}
.dk{--bg-FFFFFF:#151D1A;--bg-F3F6F4:#0D1311;--bg-EEF2F0:#212B27;--bg-EEF2F8:#17202B;--bg-DCE4F3:#26324A;--bg-E9F6EF:#133122;--bg-EAF2EE:#1C2C25;--bg-E3EAE6:#26302C;--bg-E1E6F0:#262F40;--bg-DDE5E0:#2A3430;--bg-FFF4DB:#3A2E12;--bg-E8EEFB:#1B2640;--bg-FDECEC:#3A1A1D;--bg-E6ECE8:#1A2320;--bg-0F3B2E:#0F2A21;--bg-0A0F0E:#3DDC97;--bg-0A0F0C:#1D2723;--bg-D9F5E7:#1D4A36;--fg-0A0F0D:#E8F0EC;--fg-5B6862:#9AA8A1;--fg-43504A:#B3C0B9;--fg-8A968F:#7F8C86;--fg-22324A:#D0DBEF;--fg-5B6A85:#95A5C4;--fg-8A93A6:#7A8499;--fg-12805C:#4FD69C;--fg-0F3B2E:#7FD9AA;--fg-6B4600:#F2C46B;--fg-8A5A00:#F0B850;--fg-2C4FA8:#9DB5F2;--fg-17603F:#7FD9AA;--fg-B8333A:#FF9AA0;--fg-FFFFFE:#0A0F0D;--ln-E3EAE6:#26302C;--ln-EEF2F0:#222B27;--ln-DDE5E0:#2E3A35;--ln-C9D3CD:#3C4944;--ln-DCE2EE:#26302C;--ln-E7EBF3:#232B38;color-scheme:dark}
.dk svg [fill="#0A0F0D"]{fill:#E8F0EC}
.dk img[src*="7fd6ec4499df609a"],.dk img[src*="7f4390cee228878d"],.dk img[src*="17d130cb2fd653ad"],.dk img[src*="121d9429923e05b9"],.dk img[src*="cc08603ea59eb7c0"]{filter:brightness(0) invert(1);background:transparent !important;box-shadow:none !important}
.dk img[src*="9e823dce7e60dc8d"]{filter:invert(1) hue-rotate(180deg);background:transparent !important;box-shadow:none !important}
.dk img{box-shadow:none !important}
.dk .note{box-shadow:0 0 0 1px var(--ln-2E3A35,#2E3A35),0 24px 60px rgba(0,0,0,.55) !important}
.dk .shWrap{background:rgba(0,0,0,.62) !important}
.dk .shCard{box-shadow:0 0 0 1px var(--ln-26302C,#26302C),0 30px 80px rgba(0,0,0,.6) !important}
.dk input::placeholder{color:var(--fg-6F7C76,#6F7C76)}
.dk .scroll{scrollbar-color:#34413B transparent}
.dk section[aria-label="Ready to file"],.dk section[aria-label="Find more claims"]{box-shadow:inset 0 0 0 1px var(--ln-1E4536,#1E4536)}
</style>
<style>html,body{margin:0}sc-if,sc-for{display:contents}</style></head><body><template id="tpl">
<div class="{{ rootCls }}" style="position: relative; width: 100%; height: 100vh; min-height: 640px; box-sizing: border-box; background: var(--bg-F3F6F4,#F3F6F4); color: var(--fg-0A0F0D,#0A0F0D); font-family: Manrope, sans-serif; display: flex; overflow: hidden">
<aside style="width: 232px; flex: none; display: flex; flex-direction: column; gap: 6px; padding: 22px 16px; background: var(--bg-FFFFFF,#FFFFFF); border-right: 1px solid var(--ln-E3EAE6,#E3EAE6); box-sizing: border-box"><div style="display: flex; align-items: center; gap: 8px; padding: 0 8px 18px"><svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><path fill="#0A0F0D" d="M81.4 83.6A46 46 0 0 1 51.6 96.0L51.2 83.0A33 33 0 0 0 72.5 74.1Z"></path><path fill="#0A0F0D" d="M48.4 96.0A46 46 0 0 1 18.6 83.6L27.5 74.1A33 33 0 0 0 48.8 83.0Z"></path><path fill="#0A0F0D" d="M16.4 81.4A46 46 0 0 1 4.0 51.6L17.0 51.2A33 33 0 0 0 25.9 72.5Z"></path><path fill="#0A0F0D" d="M4.0 48.4A46 46 0 0 1 16.4 18.6L25.9 27.5A33 33 0 0 0 17.0 48.8Z"></path><path fill="#0A0F0D" d="M18.6 16.4A46 46 0 0 1 48.4 4.0L48.8 17.0A33 33 0 0 0 27.5 25.9Z"></path><path fill="#12805C" d="M51.6 4.0A46 46 0 0 1 81.4 16.4L72.5 25.9A33 33 0 0 0 51.2 17.0Z"></path></svg><span style="font-size: 19px; font-weight: 800; letter-spacing: -0.4px">claim<span style="font-weight: 500">club</span><span style="font-size: .72em; font-weight: 600; color: var(--fg-12805C,#12805C); margin-left: -0.06em">.io</span></span></div><button onClick="{{ goDash }}" style="{{ navDash }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z"></path></svg>Dashboard</button><button onClick="{{ goAll }}" style="{{ navAll }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13 M8 12h13 M8 18h13 M3 6h.01 M3 12h.01 M3 18h.01"></path></svg>All settlements</button><button onClick="{{ goInfo }}" style="{{ navInfo }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2 M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8z"></path></svg>Your info</button><button onClick="{{ goSet }}" style="{{ navSettings }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"></path></svg>Settings</button><div style="margin-top: auto; padding: 14px; border-radius: 16px; background: var(--bg-F3F6F4,#F3F6F4); display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; font-weight: 800">{{ planHead }} <span style="color: var(--fg-17603F,#17603F)">{{ planBadge }}</span></span><span style="font-size: 12px; color: var(--fg-5B6862,#5B6862)">{{ planLine }}</span></div></aside>  <main class="scroll amain" style="flex-grow: 1; min-width: 0; min-height: 0; overflow-y: auto; padding: 24px 32px 32px; box-sizing: border-box; display: block">
    <div class="zwrap" style="{{ zoomSt }}">
    <sc-if value="{{ isDash }}" hint-placeholder-val="{{ true }}">
    <div class="greet" style="flex-shrink: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 4px"><h1 style="margin: 0; font-size: 22px; letter-spacing: -0.5px">Hi {{ firstName }}</h1><span style="font-size: 13px; color: var(--fg-5B6862,#5B6862)">{{ greetA }}<b style="color: var(--fg-0A0F0D,#0A0F0D)">{{ greetB }}</b>{{ greetC }}</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap">
        <span style="display: flex; flex-direction: column; padding: 7px 12px; border-radius: 12px; background: var(--bg-FFFFFF,#FFFFFF); box-shadow: inset 0 0 0 1px var(--ln-E3EAE6,#E3EAE6)"><span style="font-size: 11px; color: var(--fg-5B6862,#5B6862); font-weight: 700">Estimated</span><span style="font-size: 16px; font-weight: 800">{{ estTotal }}</span></span>
        <span style="display: flex; flex-direction: column; padding: 7px 12px; border-radius: 12px; background: var(--bg-FFFFFF,#FFFFFF); box-shadow: inset 0 0 0 1px var(--ln-E3EAE6,#E3EAE6)"><span style="font-size: 11px; color: var(--fg-5B6862,#5B6862); font-weight: 700">Tracking</span><span style="font-size: 16px; font-weight: 800">{{ trackN }}</span></span>
        <span style="display: flex; flex-direction: column; padding: 7px 12px; border-radius: 12px; background: var(--bg-FFFFFF,#FFFFFF); box-shadow: inset 0 0 0 1px var(--ln-E3EAE6,#E3EAE6)"><span style="font-size: 11px; color: var(--fg-5B6862,#5B6862); font-weight: 700">Paid to you</span><span style="font-size: 16px; font-weight: 800; color: var(--fg-12805C,#12805C)">{{ paidTotal }}</span></span>
      </div>
    </div>

    <sc-if value="{{ setupOpen }}" hint-placeholder-val="{{ true }}"><section aria-label="Finish your account" style="flex-shrink: 0; background: var(--bg-FFFFFF,#FFFFFF); border-radius: 16px; box-shadow: 0 0 0 1px var(--ln-E3EAE6,#E3EAE6); overflow: hidden">
      <div class="setupRow" style="display: flex; align-items: center; gap: 16px; padding: 12px 16px">
        <div class="setupProg" style="width: 170px; flex: none; display: flex; flex-direction: column; gap: 6px"><span style="font-size: 12px; font-weight: 800; color: var(--fg-5B6862,#5B6862)">Finish your account · {{ setupPct }}%<span class="stepTxt"> · Step {{ curN }} of {{ stepsN }}</span></span><div style="height: 6px; border-radius: 99px; background: var(--bg-E3EAE6,#E3EAE6); overflow: hidden"><div style="{{ setupBar }}"></div></div></div>
        <span class="setupDiv" style="width: 1px; align-self: stretch; background: var(--bg-EEF2F0,#EEF2F0)"></span>
        <span class="stepPill" style="flex: none; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 99px; background: var(--bg-0A0F0E,#0A0F0E); color: var(--fg-FFFFFE,#FFFFFE)">Step {{ curN }} of {{ stepsN }}</span>
        <div class="curBox" style="flex-grow: 1; min-width: 0; display: flex; align-items: center; gap: 8px"><span class="curLbl" style="font-size: 14px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ nextLabel }}</span><span style="{{ curTagStyle }}">{{ curTag }}</span><button onClick="{{ tCur.toggle }}" aria-label="Why we need this" style="width: 26px; height: 26px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--fg-7C8AA5,#7C8AA5)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4 M12 8h.01"></path></svg></button></div>
        <sc-if value="{{ curOptional }}" hint-placeholder-val="{{ false }}"><button onClick="{{ skipStep }}" style="min-height: 34px; padding: 0 14px; border-radius: 99px; background: transparent; color: var(--fg-5B6862,#5B6862); font-size: 13px; font-weight: 800">Skip</button></sc-if>
        <button onClick="{{ nextAct }}" style="flex: none; min-height: 34px; padding: 0 16px; border-radius: 99px; background: var(--bg-0A0F0E,#0A0F0E); color: var(--fg-FFFFFE,#FFFFFE); font-size: 13px; font-weight: 800">{{ curCta }}</button>
      </div>
      <sc-if value="{{ tCur.open }}" hint-placeholder-val="{{ false }}"><div style="margin: 0 16px 12px; padding: 10px 12px; border-radius: 12px; background: var(--bg-F3F6F4,#F3F6F4); font-size: 13px; line-height: 1.5; color: var(--fg-43504A,#43504A)">{{ curWhy }}</div></sc-if>
    </section></sc-if>
    <sc-if value="{{ setupDone }}" hint-placeholder-val="{{ false }}"><div class="cardin" style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-radius: 14px; background: var(--bg-E9F6EF,#E9F6EF); color: var(--fg-17603F,#17603F); font-size: 13px; font-weight: 800"><span style="width: 24px; height: 24px; border-radius: 50%; background: var(--bg-12805C,#12805C); display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>Your account is complete. Every claim you file uses your saved info.</div></sc-if>

    <sc-if value="{{ hasReady }}" hint-placeholder-val="{{ true }}"><section aria-label="Ready to file" style="flex-shrink: 0; background: var(--bg-0F3B2E,#0F3B2E); border-radius: 18px; overflow: hidden; color: var(--fg-FFFFFF,#FFFFFF)">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 16px 10px"><div style="display: flex; align-items: center; gap: 10px"><h2 style="margin: 0; font-size: 16px">Ready to file</h2><span style="font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 99px; background: var(--bg-3DDC97,#3DDC97); color: var(--fg-0A0F0B,#0A0F0B)">{{ readyN }}</span><sc-if value="{{ hasUrgent }}" hint-placeholder-val="{{ true }}"><span style="font-size: 12px; font-weight: 800; padding: 4px 10px; border-radius: 99px; background: var(--bg-FDECEC,#FDECEC); color: var(--fg-B8333A,#B8333A); white-space: nowrap; flex: none">{{ urgentN }} closing this week</span></sc-if><button onClick="{{ tReady.toggle }}" aria-label="About filing" style="width: 28px; height: 28px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: transparent; color: var(--fg-9FE8C4,#9FE8C4)"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4 M12 8h.01"></path></svg></button></div><span class="hideM" style="font-size: 12px; color: var(--fg-B9CCC2,#B9CCC2)">Tap File on each claim you want</span></div>
      <sc-if value="{{ tReady.open }}" hint-placeholder-val="{{ false }}"><div style="margin: 0 16px 12px; padding: 10px 12px; border-radius: 12px; font-size: 13px; line-height: 1.5; background: rgba(255,255,255,.1); color: var(--fg-E4F2EB,#E4F2EB)">Nothing is filed without your OK. When you tap File we submit that claim form in your name using your saved info, then send you the claim ID. Automatic settlements still need a tap so we can track the payout for you.</div></sc-if>
      <div style="display: flex; flex-direction: column; gap: 6px; padding: 0 10px 10px">
      <sc-for list="{{ ready }}" as="r" hint-placeholder-count="5"><div class="arow {{ r.cardCls }}" style="color: var(--fg-0A0F0D,#0A0F0D)">
        <img src="{{ r.logo }}" alt="" style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: var(--bg-FFFFFF,#FFFFFF); padding: 6px; box-sizing: border-box; object-fit: contain; box-shadow: inset 0 0 0 1px var(--ln-E3EAE6,#E3EAE6)">
        <div style="min-width: 0; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 14px; font-weight: 800">{{ r.co }} <span style="color: var(--fg-12805C,#12805C)">{{ r.amt }}</span></span><span style="font-size: 12px; color: var(--fg-5B6862,#5B6862); white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.title }}</span></div>
        <div class="hideS" style="min-width: 0; font-size: 12px; color: var(--fg-43504A,#43504A); display: flex; align-items: center; gap: 6px"><sc-if value="{{ r.needs }}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#8A5A00" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9 M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></sc-if>{{ r.kindNote }}</div>
        <span style="{{ r.dlStyle }}">{{ r.dl }}</span>
        <button onClick="{{ r.file }}" style="{{ r.btnA }}" aria-label="File the {{ r.co }} claim"><sc-if value="{{ r.busy }}" hint-placeholder-val="{{ false }}"><span class="spin"></span>Filing</sc-if><sc-if value="{{ r.idle }}" hint-placeholder-val="{{ true }}">File</sc-if></button>
      </div></sc-for>
      </div>
    </section></sc-if>
    <sc-if value="{{ showFind }}" hint-placeholder-val="{{ false }}"><section aria-label="Find more claims" class="cardin" style="flex-shrink: 0; background: var(--bg-0F3B2E,#0F3B2E); border-radius: 18px; color: var(--fg-FFFFFF,#FFFFFF); padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; align-items: center; justify-content: space-between; gap: 14px; flex-wrap: wrap">
        <div style="display: flex; align-items: center; gap: 12px"><span style="width: 34px; height: 34px; flex: none; border-radius: 50%; background: var(--bg-3DDC97,#3DDC97); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0A0F0D" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></span><div style="display: flex; flex-direction: column; gap: 2px"><h2 style="margin: 0; font-size: 16px">{{ findTitle }}</h2><span style="font-size: 12px; color: var(--fg-B9CCC2,#B9CCC2)">Answer a quick question and we'll add any match to Ready to file.</span></div></div>
