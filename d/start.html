<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claimclub · Check what you are owed</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script>if(innerWidth<820)location.replace('../m/start.html')</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Instrument+Serif:ital@0;1&family=Caveat:wght@500;600&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
/* desktop onboarding (perks + bank): wide two-column card */
.obwrap{flex-direction:row !important;border-radius:28px;overflow:hidden;box-shadow:0 30px 80px rgba(10,15,13,.14),0 0 0 1px #E8EEEA;min-height:min(640px,calc(100vh - 170px))}
.obwrap>.obvis{flex:1 1 56% !important;min-height:520px !important}
.obwrap>.obtxt{flex:0 0 44% !important;margin-top:0 !important;border-radius:0 !important;justify-content:center !important;padding:48px 52px !important;gap:16px !important}
.obtxt h1{font-size:clamp(36px,2.6vw,54px) !important}.obtxt p{font-size:17px !important;max-width:440px !important}
.obvis .obphone{transform:scale(1.35);transform-origin:50% 100%;bottom:-30px !important}
.obvis .notif{transform:translateX(-50%) scale(1.3) !important;transform-origin:50% 100%;bottom:120px !important}
@media (min-width:1800px){.obvis .obphone{transform:scale(1.75)}.obvis .notif{transform:translateX(-50%) scale(1.6) !important;bottom:170px !important}}
@media (min-width:2300px){.obvis .obphone{transform:scale(2.1)}.obvis .notif{transform:translateX(-50%) scale(1.9) !important;bottom:220px !important}}
@media (max-width:1100px){.obwrap{flex-direction:column !important;min-height:0}.obwrap>.obtxt{flex:none !important;padding:22px !important}.obtxt h1{font-size:34px !important}.obvis .obphone{transform:none}.obvis .notif{transform:translateX(-50%) !important;bottom:70px !important}}

body{margin:0}
a{color:#12805C}a:hover{color:#0F3B2E}
button{font-family:inherit;cursor:pointer;border:0}
button:active{transform:translateY(1px)}
@keyframes bumpA{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:none}}
@keyframes bumpB{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:none}}
@keyframes enter{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes notif{from{opacity:0;translate:0 -18px}to{opacity:1;translate:0 0}}
.notif{animation:notif .6s .3s ease both}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tick{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.bumpA{animation:bumpA .4s ease}.bumpB{animation:bumpB .4s ease}
.enter{animation:enter .3s ease both}
.spin{animation:spin 1s linear infinite}
.t1{animation:tick .4s ease .2s both}.t2{animation:tick .4s ease .9s both}.t3{animation:tick .4s ease 1.6s both}
.scroll::-webkit-scrollbar{display:none}
input:focus,select:focus,textarea:focus{outline:none !important;border-color:#12805C !important;box-shadow:0 0 0 3px rgba(18,128,92,.18) !important}
.fgroup{transition:border-color .15s,box-shadow .15s}
.fgroup:focus-within{border-color:#12805C !important;box-shadow:0 0 0 3px rgba(18,128,92,.18)}
.fgroup input:focus{box-shadow:none !important;background:#F3F6F4}
button:focus-visible{outline:2px solid #12805C;outline-offset:2px}
.mesh{background:radial-gradient(140% 100% at 100% 0%, #1F7A57 0%, rgba(31,122,87,0) 55%),radial-gradient(120% 120% at 0% 100%, #05211A 0%, rgba(5,33,26,0) 60%),linear-gradient(165deg, #134A39 0%, #0F3B2E 45%, #0A2C22 100%)}
@keyframes chkIn{0%{opacity:0;transform:translateY(60px) rotate(-8deg) scale(.92)}70%{opacity:1;transform:translateY(-4px) rotate(-1.5deg)}100%{opacity:1;transform:rotate(-2deg)}}
.chk{animation:chkIn .9s cubic-bezier(.2,.8,.2,1) .1s both}
@keyframes write{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.write{display:inline-block;clip-path:inset(0 100% 0 0);animation:write .7s steps(14,end) forwards}
.w1{animation-delay:.9s}.w2{animation-delay:1.3s;animation-duration:.6s}.w3{animation-delay:1.8s;animation-duration:1.1s}
@keyframes lpop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.lp{opacity:0;animation:lpop .35s cubic-bezier(.3,1.5,.5,1) forwards}
.sigw{display:inline-block;clip-path:inset(0 100% 0 0);animation:write 1.4s cubic-bezier(.4,0,.2,1) 3s forwards}
.w0{animation-delay:.7s;animation-duration:.5s}
.sig{stroke-dasharray:260;stroke-dashoffset:260;animation:sig 1.1s ease 3s forwards}
@keyframes sig{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){.chk,.write,.lp,.sig{animation:none !important;clip-path:none !important;opacity:1 !important;stroke-dashoffset:0 !important}}
.deskmain .scroll{flex:0 1 auto !important;min-height:0}
.deskmain > *{flex-shrink:1}

:root{color-scheme:light}
input,textarea,select{background-color:#FFFFFF;color:#0A0F0D}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #FFFFFF inset;-webkit-text-fill-color:#0A0F0D}
/* clean scrollbars */
::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:6px;height:6px;background:transparent}
::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:rgba(10,15,13,.16);border-radius:99px;border:0}
::-webkit-scrollbar-thumb:hover,.scroll::-webkit-scrollbar-thumb:hover{background:rgba(10,15,13,.3)}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar:horizontal,.scroll::-webkit-scrollbar:horizontal{height:0;display:none}
@supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:rgba(10,15,13,.18) transparent}}
</style>
<style>html,body{margin:0}sc-if,sc-for{display:contents}</style></head><body><template id="tpl">
<div style="position: relative; width: 100%; height: 100vh; min-height: 760px; box-sizing: border-box; background: #FFFFFF; color: #0A0F0D; font-family: 'Manrope', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 18px 36px; border-bottom: 1px solid #E8EEEA">
    <div style="display: flex; align-items: center; gap: 16px; min-width: 260px">
      <sc-if value="{{ showBack }}" hint-placeholder-val="{{ false }}"><button onClick="{{ back }}" aria-label="Back" style="width: 44px; height: 44px; border-radius: 12px; background: #F3F6F4; color: #0A0F0D; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button></sc-if>
      <div style="display: flex; align-items: center; gap: 8px"><svg width="28" height="28" viewBox="0 0 100 100" aria-hidden="true"><path fill="#0F3B2E" d="M81.4 83.6A46 46 0 0 1 51.6 96.0L51.2 83.0A33 33 0 0 0 72.5 74.1Z"></path><path fill="#0F3B2E" d="M48.4 96.0A46 46 0 0 1 18.6 83.6L27.5 74.1A33 33 0 0 0 48.8 83.0Z"></path><path fill="#0F3B2E" d="M16.4 81.4A46 46 0 0 1 4.0 51.6L17.0 51.2A33 33 0 0 0 25.9 72.5Z"></path><path fill="#0F3B2E" d="M4.0 48.4A46 46 0 0 1 16.4 18.6L25.9 27.5A33 33 0 0 0 17.0 48.8Z"></path><path fill="#0F3B2E" d="M18.6 16.4A46 46 0 0 1 48.4 4.0L48.8 17.0A33 33 0 0 0 27.5 25.9Z"></path><path fill="#3DDC97" d="M51.6 4.0A46 46 0 0 1 81.4 16.4L72.5 25.9A33 33 0 0 0 51.2 17.0Z"></path></svg><span style="font-size: 20px; font-weight: 800; letter-spacing: -0.5px; color: #0F3B2E">claim<span style="font-weight: 500">club</span><span style="font-size: 0.72em; font-weight: 600; color: #000000; margin-left: -0.06em">.io</span></span></div>
    </div>
    <sc-if value="{{ showSegs }}" hint-placeholder-val="{{ false }}"><div style="flex: 0 1 420px; display: flex; align-items: center; gap: 12px"><div style="{{ segGrid }}"><sc-for list="{{ segs }}" as="sg" hint-placeholder-count="9"><div style="{{ sg.style }}"></div></sc-for></div><div style="font-size: 13px; font-weight: 700; color: #5B6862; white-space: nowrap">{{ qFull }}</div></div></sc-if>
    <div style="min-width: 260px; display: flex; justify-content: flex-end; align-items: center; gap: 14px; font-size: 13px; font-weight: 600; color: #5B6862"><span>{{ L.notLaw }}</span><div role="group" aria-label="Language" style="display: flex; align-items: center; gap: 2px; padding: 3px; border-radius: 99px; background: #F3F6F4; box-shadow: inset 0 0 0 1px #E8EEEA"><button onClick="{{ setEn }}" aria-pressed="{{ isEn }}" style="{{ enStyle }}">EN</button><button onClick="{{ setEs }}" aria-pressed="{{ isEs }}" style="{{ esStyle }}">ES</button></div></div>
  </header>
  <div style="flex-grow: 1; min-height: 0; display: flex">
    <sc-if value="{{ notAuth }}" hint-placeholder-val="{{ true }}"><aside class="mesh" style="flex: 0 0 400px; box-sizing: border-box; padding: 36px; color: #FFFFFF; display: flex; flex-direction: column; gap: 18px; min-height: 0">
      <div style="display: flex; flex-direction: column; gap: 4px"><div style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; color: #C9D6CF">{{ L.estSoFar }}</div><div class="{{ bumpClass }}" style="font-size: 52px; font-weight: 800; letter-spacing: -2px; line-height: 1.05">{{ totalLabel }}</div><div style="font-size: 15px; font-weight: 600; color: #D7E3DC">{{ countMatched }}</div></div>
      <sc-if value="{{ asideMatches }}" hint-placeholder-val="{{ true }}">
        <div style="flex-grow: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px">
          <sc-for list="{{ matches }}" as="m" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px">
              <sc-if value="{{ m.hasLogo }}" hint-placeholder-val="{{ true }}"><img src="{{ m.logo }}" alt="" style="width: 38px; height: 38px; flex: none; border-radius: 10px; object-fit: contain; background: #FFFFFF; padding: 4px; box-sizing: border-box"></sc-if>
              <sc-if value="{{ m.noLogo }}" hint-placeholder-val="{{ false }}"><div style="{{ m.tileStyle }}; width: 38px; height: 38px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800">{{ m.initial }}</div></sc-if>
              <div style="flex-grow: 1; min-width: 0; font-size: 14px; font-weight: 700">{{ m.co }}</div>
              <div style="font-size: 13px; font-weight: 800; color: #3DDC97; white-space: nowrap">{{ m.amtLabel }}</div>
            </div>
          </sc-for>
          <sc-if value="{{ noMatches }}" hint-placeholder-val="{{ false }}"><div style="font-size: 15px; line-height: 1.6; color: #D7E3DC; background: rgba(255,255,255,.07); border-radius: 16px; padding: 18px">{{ L.asideEmpty }}</div></sc-if>
        </div>
      </sc-if>
      <sc-if value="{{ asideInfo }}" hint-placeholder-val="{{ false }}">
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 14px; font-size: 15px; font-weight: 600; color: #D7E3DC">
          <div style="display: flex; gap: 10px"><span style="color: #3DDC97">●</span>{{ L.b1 }}</div>
          <div style="display: flex; gap: 10px"><span style="color: #3DDC97">●</span>{{ L.b2 }}</div>
          <div style="display: flex; gap: 10px"><span style="color: #3DDC97">●</span>{{ L.b3 }}</div>
          <div style="display: flex; gap: 10px"><span style="color: #3DDC97">●</span>{{ L.b4 }}</div>
        </div>
      </sc-if>
      <div style="font-size: 12px; line-height: 1.6; color: #C9D6CF">{{ L.asideNote }}</div>
    </aside></sc-if>
    <main style="flex-grow: 1; min-width: 0; display: flex; justify-content: center; background: #F8FAF9">
      <div class="deskmain" style="{{ mainStyle }}">
  <!-- INTRO 1 -->
  <sc-if value="{{ isIntro1 }}" hint-placeholder-val="{{ true }}">
    <div class="enter scroll" style="flex-grow: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 22px">
      <h1 style="margin: 0; font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: -1.2px; color: #0F3B2E">{{ L.i1a }}<span style="color: #12805C">{{ L.i1b }}</span></h1>
      <div style="font-size: 16px; line-height: 1.6; color: #43504A">{{ L.i1p }}</div>
      <figure aria-label="{{ L.exHead }}" style="margin: 0; cursor: default; user-select: none; background: #F3F6F4; border-radius: 20px; padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><span style="font-size: 11px; font-weight: 800; letter-spacing: 1.4px; color: #5B6862">{{ L.exHead }}</span><span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 15px; color: #5B6862">{{ L.exNote }}</span></div>
        <sc-for list="{{ teaser }}" as="t" hint-placeholder-count="3">
          <div style="display: flex; align-items: flex-start; gap: 12px">
            <sc-if value="{{ t.hasLogo }}" hint-placeholder-val="{{ true }}"><img src="{{ t.logo }}" alt="" style="width: 30px; height: 30px; flex: none; border-radius: 50%; object-fit: contain; background: #FFFFFF; padding: 4px; box-sizing: border-box; margin-top: 1px"></sc-if><sc-if value="{{ t.noLogo }}" hint-placeholder-val="{{ false }}"><div style="{{ t.tileStyle }}; width: 30px; height: 30px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px">{{ t.initial }}</div></sc-if>
            <p style="margin: 0; font-size: 15px; line-height: 1.5; color: #43504A"><strong style="color: #0A0F0D">{{ t.co }}</strong> {{ t.line }}</p>
          </div>
        </sc-for>
        <figcaption style="font-size: 12px; line-height: 1.5; color: #5B6862; border-top: 1px dashed #CFDAD3; padding-top: 12px">{{ L.exFoot }}</figcaption>
      </figure>
    </div>
    <div style="padding: 12px 22px 26px"><button onClick="{{ next }}" style="{{ primary }}">{{ L.next }}</button></div>
  </sc-if>

  <!-- INTRO 2 -->
  <sc-if value="{{ isIntro2 }}" hint-placeholder-val="{{ false }}">
    <div class="enter scroll" style="flex-grow: 1; overflow-y: auto; padding: 16px 22px; display: flex; flex-direction: column; gap: 22px">
      <h1 style="margin: 0; font-size: 34px; line-height: 1.08; font-weight: 800; letter-spacing: -1.2px; color: #0F3B2E">{{ i2h }}</h1>
      <div style="display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; gap: 14px; align-items: flex-start"><div style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #3E63DD; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">1</div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-weight: 800; font-size: 16px">{{ L.match }}</div><div style="font-size: 14px; line-height: 1.5; color: #43504A">{{ L.matchP }}</div></div></div>
        <div style="display: flex; gap: 14px; align-items: flex-start"><div style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #12805C; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">2</div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-weight: 800; font-size: 16px">{{ L.file }}</div><div style="font-size: 14px; line-height: 1.5; color: #43504A">{{ L.fileP }}</div></div></div>
        <div style="display: flex; gap: 14px; align-items: flex-start"><div style="width: 36px; height: 36px; flex: none; border-radius: 10px; background: #218358; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800">3</div><div style="display: flex; flex-direction: column; gap: 2px"><div style="font-weight: 800; font-size: 16px">{{ L.paid }}</div><div style="font-size: 14px; line-height: 1.5; color: #43504A">{{ L.paidP }}</div></div></div>
      </div>
      <div style="font-size: 12px; line-height: 1.6; color: #5B6862; background: #F3F6F4; padding: 12px 14px; border-radius: 12px">{{ L.disclaim }}</div>
    </div>
    <div style="padding: 12px 22px 26px"><button onClick="{{ next }}" style="{{ primary }}">{{ L.start }}</button></div>
  </sc-if>

  <!-- STATE -->
  <sc-if value="{{ isState }}" hint-placeholder-val="{{ false }}">
    <div class="enter scroll" style="flex-grow: 1; overflow-y: auto; padding: 16px 22px 26px; display: flex; flex-direction: column; gap: 18px">
      <h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.8px">{{ L.stateH }}</h1>
      <div style="font-size: 15px; color: #5B6862; margin-top: -8px">{{ L.stateP }}</div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px"><sc-for list="{{ states }}" as="x" hint-placeholder-count="12"><button onClick="{{ x.pick }}" style="{{ x.style }}">{{ x.label }}</button></sc-for></div>
    </div>
  </sc-if>

  <!-- QUESTION -->
  <sc-if value="{{ isQ }}" hint-placeholder-val="{{ false }}">
    <div class="scroll" style="flex-grow: 1; overflow-y: auto; padding: 14px 22px 16px; display: flex; flex-direction: column; gap: 18px">
      <div class="enter" style="display: flex; flex-direction: column; gap: 14px">
        <sc-if value="{{ q.hasBrandLogo }}" hint-placeholder-val="{{ true }}"><div style="align-self: center; width: 112px; height: 112px; border-radius: 30px; background: #FFFFFF; box-shadow: 0 14px 34px rgba(10,15,13,.14), inset 0 0 0 1px #DDE5E0; display: flex; align-items: center; justify-content: center"><img src="{{ q.brandLogo }}" alt="{{ q.brand }} logo" style="width: 64px; height: 64px; object-fit: contain"></div></sc-if>
        <h1 style="margin: 0; font-size: 24px; line-height: 1.2; font-weight: 800; letter-spacing: -0.6px">{{ q.title }}</h1>
        <div style="font-size: 14px; color: #5B6862">{{ q.sub }}</div>
      </div>
      <sc-if value="{{ q.notQuick }}" hint-placeholder-val="{{ true }}">
      <div style="{{ q.gridStyle }}">
        <sc-for list="{{ q.opts }}" as="o" hint-placeholder-count="3">
          <button onClick="{{ o.pick }}" style="{{ o.style }}">
            <sc-if value="{{ o.hasLogo }}" hint-placeholder-val="{{ false }}"><img src="{{ o.logo }}" alt="" style="width: 34px; height: 34px; flex: none; border-radius: 10px; object-fit: contain; background: #FFFFFF; padding: 3px; box-sizing: border-box"></sc-if><span style="{{ o.markStyle }}"><sc-if value="{{ o.sel }}" hint-placeholder-val="{{ false }}"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></sc-if></span>
            <span style="display: flex; flex-direction: column; gap: 2px"><span>{{ o.label }}</span><sc-if value="{{ o.hasSub }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 600; opacity: .8">{{ o.sub }}</span></sc-if></span>
          </button>
        </sc-for>
      </div>
      </sc-if>
      <sc-if value="{{ q.isQuick }}" hint-placeholder-val="{{ false }}">
      <div style="{{ qTileGrid }}">
        <sc-for list="{{ q.opts }}" as="o" hint-placeholder-count="10">
          <button onClick="{{ o.pick }}" role="checkbox" aria-checked="{{ o.sel }}" style="{{ o.tile }}; flex-direction: row; align-items: center; gap: 10px; min-height: 64px">
            <sc-if value="{{ o.hasLogo }}" hint-placeholder-val="{{ true }}"><img src="{{ o.logo }}" alt="" style="width: 34px; height: 34px; flex: none; border-radius: 9px; object-fit: contain; background: #FFFFFF; box-shadow: inset 0 0 0 1px #E8EEEA; padding: 4px; box-sizing: border-box"></sc-if>
            <span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; padding-right: 22px"><span style="font-size: 14px; line-height: 1.25; font-weight: 700; color: #0A0F0D">{{ o.label }}</span><span style="font-size: 12px; font-weight: 700; color: #5B6862">{{ o.sub }}</span></span>
            <span style="{{ o.check }}; top: 50%; margin-top: -10px"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          </button>
        </sc-for>
      </div>
      </sc-if>
    </div>
    <div style="padding: 10px 22px 26px">
      <sc-if value="{{ q.isQuick }}" hint-placeholder-val="{{ false }}"><button onClick="{{ quickCont }}" disabled="{{ quickContDisabled }}" style="{{ quickContStyle }}">{{ quickContLabel }}</button><button onClick="{{ browseAll }}" style="display: block; width: 100%; min-height: 40px; margin-top: 6px; background: transparent; color: #12805C; font-size: 14px; font-weight: 800; text-decoration: underline">{{ browseLabel }}</button></sc-if>
      <sc-if value="{{ q.notQuick }}" hint-placeholder-val="{{ false }}"><sc-if value="{{ q.multi }}" hint-placeholder-val="{{ false }}"><button onClick="{{ next }}" disabled="{{ nextDisabled }}" style="{{ nextStyle }}">{{ L.cont }}</button></sc-if></sc-if>
      <sc-if value="{{ q.single }}" hint-placeholder-val="{{ true }}"><div style="text-align: center; font-size: 13px; font-weight: 600; color: #5B6862; padding: 16px 0">{{ L.tapAns }}</div></sc-if>
    </div>
  </sc-if>

  <!-- PICKED SUMMARY -->
  <sc-if value="{{ isPicked }}" hint-placeholder-val="{{ false }}">
    <div class="enter scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 22px 10px; display: flex; flex-direction: column; gap: 14px">
      <div style="display: flex; flex-direction: column; gap: 6px"><h1 style="margin: 0; font-size: 26px; line-height: 1.15; font-weight: 800; letter-spacing: -0.8px">{{ pickedH }}</h1><div style="font-size: 15px; line-height: 1.5; color: #5B6862">{{ pickedSub }}</div></div>
      <sc-if value="{{ hasPicked }}" hint-placeholder-val="{{ true }}">
        <div style="background: #FFFFFF; border: 1px solid #DDE5E0; border-radius: 18px; padding: 4px 14px">
          <sc-for list="{{ matches }}" as="m" hint-placeholder-count="3">

  daysLeft(dl) {
    if (!dl) return 999;
    const d = new Date(dl + 'T23:59:00');
    return Math.max(0, Math.ceil((d - new Date()) / 86400000));
  }
  fmtDate(dl) {
    if (!dl) return 'No deadline';
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const [y, mo, da] = dl.split('-').map(Number);
    return m[mo - 1] + ' ' + da + ', ' + y;
  }
  money(n) {
    return '$' + (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: n % 1 ? 2 : 0 });

      btn: (on) => 'width:100%;height:58px;border-radius:999px;font-family:inherit;font-size:16px;font-weight:800;' + (on ? 'background:#3DDC97;color:#0F3B2E' : 'background:#E8EEEA;color:#6E7A73;cursor:not-allowed'),
      stateBtn: (on) => 'height:54px;border-radius:16px;font-family:inherit;font-size:16px;font-weight:800;' + (on ? 'background:#0F3B2E;color:#FFFFFF' : 'background:#EAF2EE;color:#0F3B2E'),
      act: (here) => 'min-height:40px;padding:0 14px;border-radius:999px;font-family:inherit;font-weight:800;font-size:13px;' + (here ? 'background:#3DDC97;color:#0F3B2E' : 'background:#FFFFFF;color:#0F3B2E;box-shadow:inset 0 0 0 1.5px #0F3B2E')
    };
  }
}

bootDC(Component,{},(c,v)=>ccLive(c,v));
</script></body></html>
