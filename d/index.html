  // How it works phones: play each phone's animation once, when it scrolls into view.
  howAnim() {
    const phones = Array.from(document.querySelectorAll('.howv2 .iph'));
    if (!phones.length) return;
    this._howPlayed = this._howPlayed || new Set();
    const play = (el) => {
      const i = phones.indexOf(el); if (i < 0 || this._howPlayed.has(i)) return;
      this._howPlayed.add(i);
      el.querySelectorAll('.hin').forEach((n, k) => { n.style.animationDelay = (0.25 + k * 0.18) + 's'; });
      el.classList.add('play');
    };
    phones.forEach((el, i) => { if (this._howPlayed.has(i) && !el.classList.contains('play')) el.classList.add('done'); });
    if (!('IntersectionObserver' in window)) { phones.forEach(play); return; }
    if (this._howObs) this._howObs.disconnect();
    this._howObs = new IntersectionObserver((es) => es.forEach(e => { if (e.isIntersecting) play(e.target); }), { threshold: 0.45 });
    phones.forEach(el => { if (!el.classList.contains('play') && !el.classList.contains('done')) this._howObs.observe(el); });
  }
