<style>
*{box-sizing:border-box}
body{margin:0;font-family:Manrope,system-ui,sans-serif;color:#0A0F0D;background:#F3F6F4;font-size:14px}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;background:none}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3DDC97;outline-offset:2px}
input,select,textarea{font-family:inherit;font-size:14px;color:#0A0F0D}
a{color:#12805C}
.app{display:flex;min-height:100vh}
.side{width:224px;flex:none;background:#0F3B2E;color:#FFFFFF;padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:8px;padding:0 8px 18px;font-size:18px;font-weight:800}
.brand small{font-size:11px;font-weight:800;letter-spacing:1px;color:#3DDC97;margin-left:4px}
.nav{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700;color:#C9D6CF;text-align:left}
.nav:hover{background:rgba(255,255,255,.06)}
.nav.on{background:rgba(61,220,151,.16);color:#FFFFFF}
.nav .ct{margin-left:auto;font-size:11px;font-weight:800;padding:2px 8px;border-radius:99px;background:#3DDC97;color:#0A0F0D}
.side .who{margin-top:auto;font-size:12px;color:#9FC2B3;padding:8px;word-break:break-all}
.side .who button{color:#FFFFFF;font-weight:800;font-size:12px;padding:0;margin-top:6px;text-decoration:underline}
main{flex:1;min-width:0;padding:24px 28px 60px}
h1{margin:0 0 4px;font-size:24px;letter-spacing:-.5px}
.sub{color:#5B6862;font-size:13px;margin-bottom:18px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.tile{background:#FFFFFF;border-radius:16px;padding:14px 16px;box-shadow:0 0 0 1px #E3EAE6}
.tile .k{font-size:12px;font-weight:700;color:#5B6862}
.tile .v{font-size:26px;font-weight:800;letter-spacing:-.6px;margin-top:4px}
.tile .h{font-size:12px;color:#8A968F;margin-top:2px}
.card{background:#FFFFFF;border-radius:18px;box-shadow:0 0 0 1px #E3EAE6;padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:16px}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;letter-spacing:.6px;text-transform:uppercase;color:#8A968F;text-align:left;font-weight:800;padding:8px 10px;border-bottom:1px solid #E8EEEA;white-space:nowrap}
td{padding:10px;border-bottom:1px solid #EEF2F0;vertical-align:top}
tr.click{cursor:pointer}tr.click:hover td{background:#F6F8F7}
.pill{display:inline-block;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:99px;white-space:nowrap}
.p-ready{background:#EEF2F0;color:#43504A}.p-requested{background:#0F3B2E;color:#FFFFFF}.p-needs_info{background:#FFF4DB;color:#8A5A00}.p-filed{background:#E8EEFB;color:#2C4FA8}.p-review{background:#FFF4DB;color:#8A5A00}.p-approved{background:#E9F6EF;color:#17603F}.p-paid{background:#12805C;color:#FFFFFF}.p-denied{background:#FDECEC;color:#B8333A}.p-removed{background:#EEF2F0;color:#8A968F}
.muted{color:#5B6862}.small{font-size:12px}
.btn{min-height:36px;padding:0 16px;border-radius:99px;font-weight:800;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn.dark{background:#0A0F0D;color:#FFFFFF}.btn.mint{background:#3DDC97;color:#0A0F0D}.btn.soft{background:#EEF2F0}
.inp{height:38px;border-radius:10px;border:1.5px solid #DDE5E0;padding:0 12px;background:#FFFFFF;width:100%}
textarea.inp{height:auto;min-height:64px;padding:10px 12px;resize:vertical}
.bar{height:10px;border-radius:99px;background:#EEF2F0;overflow:hidden}.bar>span{display:block;height:100%;border-radius:99px;background:#12805C}
.row{display:flex;align-items:center;gap:10px}
.drawer{position:fixed;inset:0;background:rgba(10,15,13,.4);display:flex;justify-content:flex-end;z-index:50}
.drawer>div{width:min(760px,100%);height:100%;overflow-y:auto;background:#F3F6F4;padding:22px 24px 60px}
.modal{position:fixed;inset:0;background:rgba(10,15,13,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.modal>div{width:min(720px,100%);max-height:100%;overflow-y:auto;background:#FFFFFF;border-radius:20px;padding:24px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv dt{color:#8A968F;font-weight:700}.kv dd{margin:0;font-weight:700;overflow-wrap:anywhere}
.copy{font-size:11px;font-weight:800;color:#12805C;margin-left:6px;padding:0}
.sig{font-family:'Mrs Saint Delafield',cursive;font-size:44px;line-height:1;color:#0F3B2E;border-bottom:1.5px solid #0A0F0D;padding:4px 8px 2px;display:inline-block;min-width:260px}
.stmt{font-size:13px;line-height:1.55;background:#F3F6F4;border-radius:12px;padding:12px 14px;margin:6px 0}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login .box{width:400px;max-width:100%;background:#FFFFFF;border-radius:24px;box-shadow:0 0 0 1px #E3EAE6,0 20px 60px rgba(10,15,13,.08);padding:28px;display:flex;flex-direction:column;gap:14px}
.otp{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.otp div{height:54px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;box-shadow:inset 0 0 0 1.5px #DDE5E0}
.otp div.on{box-shadow:inset 0 0 0 2px #12805C,0 0 0 4px rgba(61,220,151,.25)}
.otp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.err{color:#B8333A;font-weight:700;font-size:13px}
.empty{padding:28px;text-align:center;color:#5B6862}
.chart{display:flex;align-items:flex-end;gap:3px;height:120px}
.chart span{flex:1;background:#3DDC97;border-radius:4px 4px 0 0;min-height:2px;position:relative}
.chart span.o{background:#12805C}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:99px;background:#EEF2F0}
.seg button{padding:6px 12px;border-radius:99px;font-weight:800;font-size:12px;color:#43504A}
.seg button.on{background:#FFFFFF;color:#0A0F0D;box-shadow:0 1px 3px rgba(10,15,13,.12)}
@media (max-width:900px){.app{flex-direction:column}.side{width:100%;height:auto;position:sticky;top:0;z-index:20;flex-direction:row;flex-wrap:nowrap;align-items:center;gap:4px;padding:10px 12px;overflow-x:auto;scrollbar-width:none;box-sizing:border-box}.side::-webkit-scrollbar{display:none}.brand{padding:0 8px 0 4px;flex:none;font-size:16px}.nav{width:auto;flex:none;padding:8px 12px;white-space:nowrap}.nav svg{display:none}.nav .ct{margin-left:4px}.side .who{margin:0 0 0 auto;padding:0 4px;flex:none;font-size:0;word-break:normal}.side .who br{display:none}.side .who button{margin:0;font-size:12px;white-space:nowrap}.grid2{grid-template-columns:1fr}main{padding:18px 16px 48px}.kv{grid-template-columns:110px minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){table:has(thead) thead{display:none}table:has(thead) tr{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 2px;border-bottom:1px solid #EEF2F0}table:has(thead) td{display:block;padding:0;border:0}table:has(thead) td:first-child{flex-basis:100%}.modal{padding:0 !important}.modal>div{border-radius:0 !important;max-height:100dvh !important;min-height:100dvh;width:100% !important;max-width:none !important;box-sizing:border-box}h1{font-size:21px}.tile .v{font-size:22px}}
@media print{.side,.noprint{display:none!important}.modal{position:static;background:none;padding:0}.modal>div{box-shadow:none;max-height:none}}
</style>
<style id="cc-hover">/* Simple hover effect for every button on the site */
@media (hover:hover){
button:not(:disabled),[role=button],a[href][style*="border-radius"]:not(.lift):not([class*="card"]),a.cta,a.btn,.btn{transition:transform .15s ease,filter .15s ease,box-shadow .15s ease}
button:not(:disabled):hover,[role=button]:hover,a[href][style*="border-radius"]:not(.lift):not([class*="card"]):hover,a.cta:hover,a.btn:hover,.btn:hover{transform:translateY(-1px);filter:brightness(1.06);box-shadow:0 6px 16px rgba(10,15,13,.14)}
button:not(:disabled):active,[role=button]:active,a[href][style*="border-radius"]:not(.lift):not([class*="card"]):active,a.cta:active,a.btn:active,.btn:active{transform:translateY(0) scale(.98);filter:brightness(.97);box-shadow:none}
}
@media (hover:hover){button[style*="background: transparent"]:not(:disabled):hover,button[style*="background:transparent"]:not(:disabled):hover{transform:none;filter:none;box-shadow:none;opacity:.72}button[style*="background: transparent"]:not(:disabled):active,button[style*="background:transparent"]:not(:disabled):active{transform:scale(.98);box-shadow:none}}
@media (prefers-reduced-motion: reduce){button,[role=button],a[href]{transition:none !important}}
</style>

async function api(action, extra) {
  const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token }, body: JSON.stringify(Object.assign({ action }, extra || {})) });
  const j = await r.json().catch(() => ({ error: 'Bad response' }));
  if (!r.ok || j.error) throw new Error(j.error || ('Error ' + r.status));
  return j;

function renderLogin() {
  const s = state;

    + (!s.sent

      : '<h1 style="font-size:22px">Check your email</h1><span class="muted">Enter the code sent to <b>' + esc(s.email) + '</b>.</span><div class="otp">' + [0, 1, 2, 3, 4, 5].map((i) => '<div class="' + (i === Math.min(s.code.length, 5) ? 'on' : '') + '">' + esc(s.code[i] || '') + '</div>').join('') + '<input id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-label="6-digit code" value="' + esc(s.code) + '"></div><button id="verify" class="btn mint" style="min-height:48px;justify-content:center">' + (s.busy ? 'Checking...' : 'Sign in') + '</button><button id="back" class="small muted" style="text-align:left;padding:0;font-weight:800">Use a different email</button>')
    + (s.err ? '<span class="err" role="alert">' + esc(s.err) + '</span>' : '') + '</div></div>';
  if (!s.sent) {
    const em = $('#em'); em.focus(); em.oninput = () => { s.email = em.value; };
    $('#send').onclick = async () => {
      s.email = em.value.trim().toLowerCase(); if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s.email)) { s.err = 'Enter your email'; return renderLogin(); }
      s.busy = true; s.err = ''; renderLogin();
      const { error } = await sb.auth.signInWithOtp({ email: s.email, options: { shouldCreateUser: false } });
      s.busy = false; if (error) s.err = /signups not allowed|not found/i.test(error.message) ? 'No account with that email.' : error.message; else { s.sent = true; s.code = ''; }
      renderLogin();
    };
  } else {
    const c = $('#code'); c.focus(); const len = c.value.length; c.setSelectionRange(len, len);
    c.oninput = () => { s.code = c.value.replace(/\D/g, '').slice(0, 6); s.err = ''; renderLogin(); if (s.code.length === 6) verify(); };
    $('#verify').onclick = verify; $('#back').onclick = () => { s.sent = false; s.code = ''; s.err = ''; renderLogin(); };
  }
}
async function verify() {
  const s = state; if (s.busy || s.code.length !== 6) return;
  s.busy = true; renderLogin();
  const { data, error } = await sb.auth.verifyOtp({ email: s.email, token: s.code, type: 'email' });
  if (error || !data.session) { const { data: d2 } = await sb.auth.getSession(); if (d2 && d2.session) return start(d2.session); s.busy = false; s.code = ''; s.err = 'That code did not work.'; return renderLogin(); }
  start(data.session);
}
async function start(session) {
  token = session.access_token;
  try { me = await api('me'); } catch (e) { state.busy = false; state.sent = false; state.err = e.message === 'This account is not an admin' ? 'This account is not an admin. Ask the owner to add you.' : e.message; await sb.auth.signOut(); return renderLogin(); }

}

  };
  if (c.authorization) {
    try { const a = (await api('authorization', { id: c.authorization.id })).authorization; $('#authBox').innerHTML = '<h2>Signed authorization</h2>' + authSummary(a) + '<button class="btn soft" id="seeAuth" style="margin-top:10px">' + ico(IC.pen, 14) + 'View full signed record</button>'; $('#seeAuth').onclick = () => authModal(a); }
    catch (e) { $('#authBox').innerHTML = '<h2>Signed authorization</h2><div class="err">' + esc(e.message) + '</div>'; }
  }
}
function authSummary(a) {
  return '<div class="small" style="line-height:1.6">Signed <b>' + fmtDate(a.created_at) + '</b> by <b>' + esc(a.signer_name) + '</b> (' + (a.method === 'bulk' ? 'signed with other forms at once' : 'signed on its own') + ')<br>From IP ' + esc(a.ip || 'unknown') + '</div>'
    + (a.answers && a.answers.length ? a.answers.map((x) => '<div class="stmt"><b>' + esc(x.q) + '</b><br>Answer: ' + esc(x.a) + '</div>').join('') : '');
}
function authModal(a) {
  const st = a.statements || {}, dt = a.details || {};
  const m = document.createElement('div'); m.className = 'modal'; m.id = 'am';
  m.innerHTML = '<div role="dialog" aria-modal="true" aria-label="Signed authorization">'
    + '<div class="row noprint" style="justify-content:flex-end;gap:8px;margin-bottom:6px"><button class="btn soft" id="pr">Print or save PDF</button><button class="btn soft" id="ax">' + ico(IC.x, 14) + 'Close</button></div>'
    + '<div style="font-size:12px;font-weight:800;letter-spacing:1px;color:#8A968F">CLAIM FILING AUTHORIZATION · RECORD #' + a.id + '</div><h1 style="font-size:22px;margin:4px 0 14px">' + esc(a.settlement_title || setName(a.settlement_id)) + '</h1>'
    + '<dl class="kv">' + [['Signer', a.signer_name], ['Email', a.email], ['Phone', dt.phone], ['Date of birth', dt.dob], ['Address', [dt.street, dt.apt, dt.city, dt.state, dt.zip].filter(Boolean).join(', ')]].map(([k, v]) => '<dt>' + k + '</dt><dd>' + esc(v || '') + '</dd>').join('') + '</dl>'
    + (a.answers || []).map((x) => '<div class="stmt"><b>' + esc(x.q) + '</b><br>Answer: ' + esc(x.a) + '</div>').join('')
    + (st.attestation ? '<div class="stmt">' + esc(st.attestation) + '</div>' : '') + (st.perjury ? '<div class="stmt">' + esc(st.perjury) + '</div>' : '')
    + (st.consent ? '<div class="stmt">' + esc(st.consent) + (st.agreement_url ? ' (' + esc(st.agreement_url) + ', version ' + esc(a.agreement_version || '') + ')' : '') + ' <b>Checked: yes</b></div>' : '')
    + '<div style="margin:18px 0 6px"><div class="sig">' + esc(a.signature_text) + '</div><div class="small muted" style="margin-top:4px">Electronic signature of ' + esc(a.signer_name) + '</div></div>'
    + '<h2 style="font-size:14px;margin:18px 0 8px">Audit trail</h2><dl class="kv small">' + [['Recorded by server', fmtDate(a.created_at) + ' (' + a.created_at + ')'], ['Signed on device', a.client_signed_at ? fmtDate(a.client_signed_at) : ''], ['Method', a.method === 'bulk' ? 'Signed all forms at once' : 'Signed this form on its own'], ['IP address', a.ip], ['Browser', a.user_agent], ['Page', a.page], ['Language', a.lang], ['Record hash (SHA-256)', a.record_hash]].map(([k, v]) => '<dt>' + k + '</dt><dd>' + esc(v || '') + '</dd>').join('') + '</dl></div>';
  document.body.appendChild(m);
  $('#ax').onclick = () => m.remove(); m.onclick = (e) => { if (e.target === m) m.remove(); };
  $('#pr').onclick = () => window.print();
}
function layer(h) { $('#layer').innerHTML = h; document.body.style.overflow = 'hidden'; const f = $('#layer button'); if (f) f.focus(); }
function closeLayer() { $('#layer').innerHTML = ''; document.body.style.overflow = ''; }
document.addEventListener('keydown', (e) => { if (e.key !== 'Escape') return; const am = $('#am'); if (am) return am.remove(); closeLayer(); });

// ---------- members ----------
async function members() {
  const q = cache.mq || '';
  main('<h1>Members</h1><div class="sub">Everyone with an account. Open a member to see their saved info, claims and signed forms.</div><div class="row" style="margin-bottom:12px"><input id="mq" class="inp" style="max-width:360px" placeholder="Search name, email or phone" value="' + esc(q) + '"><button class="btn dark" id="mgo">Search</button></div><div id="mlist" class="card" style="padding:6px 6px 2px"><div class="empty">Loading...</div></div>');
  const run = async () => {
    cache.mq = $('#mq').value.trim();
    let r; try { r = await api('users', { q: cache.mq }); } catch (e) { $('#mlist').innerHTML = '<div class="err" style="padding:12px">' + esc(e.message) + '</div>'; return; }
    $('#mlist').innerHTML = r.users.length ? '<table><thead><tr><th>Member</th><th>Plan</th><th>Claims</th><th>To file</th><th>Signed</th><th>Joined</th></tr></thead><tbody>' + r.users.map((u, i) => '<tr class="click" tabindex="0" data-id="' + esc(u.id) + '"><td><b>' + esc(u.name || 'No name yet') + '</b><div class="small muted">' + esc(u.email) + (u.phone ? ' · ' + esc(u.phone) : '') + '</div></td><td>' + (u.membership ? (u.membership.kind === 'member' ? esc(u.membership.plan || '') + ' member' : 'Filing fee') + ' <span class="small muted">' + esc(u.membership.status) + '</span>' : '<span class="muted">None</span>') + '</td><td>' + u.claims + '</td><td>' + (u.requested ? '<span class="pill p-requested">' + u.requested + '</span>' : '0') + '</td><td>' + u.signed + '</td><td class="small">' + fmtDay(u.created_at) + '</td></tr>').join('') + '</tbody></table><div class="small muted" style="padding:10px">' + r.total + ' total' + (r.total > 50 ? ', showing the newest 50' : '') + '</div>' : '<div class="empty">No members found</div>';
    document.querySelectorAll('#mlist tr.click').forEach((tr) => { tr.onclick = () => memberPanel(tr.dataset.id); tr.onkeydown = (e) => { if (e.key === 'Enter') memberPanel(tr.dataset.id); }; });
  };
  $('#mgo').onclick = run; $('#mq').onkeydown = (e) => { if (e.key === 'Enter') run(); };
  run();
}
async function memberPanel(id) {
  layer('<div class="drawer" id="dr"><div><div class="empty">Loading...</div></div></div>');
  $('#dr').onclick = (e) => { if (e.target.id === 'dr') closeLayer(); };
  let r; try { r = await api('user', { id }); } catch (e) { $('#dr').firstChild.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; return; }
  const p = r.profile, h = p.payout_handles || {};
  const kv = (k, v) => '<dt>' + k + '</dt><dd>' + (v ? esc(v) + copyBtn(v) : '<span class="muted">Not provided</span>') + '</dd>';
  $('#dr').firstChild.outerHTML = '<div role="dialog" aria-modal="true" aria-label="Member">'
    + '<div class="row" style="justify-content:space-between;margin-bottom:12px"><div><h1 style="font-size:20px">' + esc(p.name || 'No name yet') + '</h1><div class="muted small">' + esc(p.email) + ' · joined ' + fmtDay(p.created_at) + '</div></div><button class="btn soft" id="x">' + ico(IC.x, 14) + 'Close</button></div>'
    + '<div class="card"><h2>Saved info</h2><dl class="kv">' + kv('Legal name', p.name) + kv('Email', p.email) + kv('Phone', p.phone) + kv('Date of birth', p.dob) + kv('Address', p.address) + kv('Past addresses', (p.past_addresses || []).join(' | ')) + kv('Payout method', p.pay_default + (h[p.pay_default] ? ' · ' + h[p.pay_default] : '')) + (me.settings && me.settings.bank_connect ? kv('Bank connected', p.bank_connected ? 'Yes' : 'No') : '') + kv('Email updates', p.email_receipts === false ? 'Off' : 'On') + '</dl></div>'
    + '<div class="card"><h2>Membership and orders</h2>' + (r.membership ? '<div style="margin-bottom:8px"><b>' + (r.membership.kind === 'member' ? esc(r.membership.plan) + ' membership' : 'Filing fee') + '</b> · ' + esc(r.membership.status) + (r.membership.renews_at ? ' · renews ' + fmtDay(r.membership.renews_at) : '') + '</div>' : '<div class="muted" style="margin-bottom:8px">No membership</div>')
    + (r.purchases.length ? '<table><tbody>' + r.purchases.map((x) => '<tr><td>' + fmtDate(x.created_at) + '</td><td>' + esc(x.kind === 'member' ? (x.plan || '') + ' membership' : 'Filing fee') + '</td><td style="text-align:right;font-weight:800">' + (x.amount_cents != null ? '$' + (x.amount_cents / 100).toFixed(2) : '') + '</td></tr>').join('') + '</tbody></table>' : '<div class="muted small">No orders</div>') + '</div>'
    + '<div class="card"><h2>Claims</h2>' + (r.claims.length ? '<table><thead><tr><th>Settlement</th><th>Status</th><th>Claim ID</th><th>Signed</th></tr></thead><tbody>' + r.claims.map((c, i) => { const a = r.authorizations.find((x) => x.settlement_id === c.settlement_id); return '<tr class="click" data-c="' + i + '"><td>' + esc(setName(c.settlement_id)) + '</td><td>' + pill(c.status) + '</td><td class="small">' + esc(c.claim_ref || '') + '</td><td>' + (a ? '<span class="pill p-approved">Signed</span>' : '<span class="muted small">No</span>') + '</td></tr>'; }).join('') + '</tbody></table>' : '<div class="muted small">No claims</div>') + '</div>'
    + '<div class="card"><h2>Signed authorizations</h2>' + (r.authorizations.length ? '<table><tbody>' + r.authorizations.map((a, i) => '<tr class="click" data-a="' + i + '"><td><b>' + esc(a.settlement_title || setName(a.settlement_id)) + '</b><div class="small muted">' + esc(a.signer_name) + ' · ' + (a.method === 'bulk' ? 'signed with other forms' : 'signed on its own') + '</div></td><td class="small">' + fmtDate(a.created_at) + '<div class="muted">IP ' + esc(a.ip || '') + '</div></td><td style="text-align:right"><span class="btn soft" style="min-height:30px">View</span></td></tr>').join('') + '</tbody></table>' : '<div class="muted small">No signed forms on file</div>') + '</div>'
    + '<div class="card"><h2>History</h2>' + (r.events.length ? '<table><tbody>' + r.events.map((e) => '<tr><td class="small">' + fmtDate(e.created_at) + '</td><td>' + esc(setName(e.settlement_id)) + '</td><td>' + pill(e.status) + '</td><td class="small muted">' + esc(e.actor) + (e.note ? ' · ' + esc(e.note) : '') + (e.emailed ? ' · emailed' : '') + '</td></tr>').join('') + '</tbody></table>' : '<div class="muted small">Nothing yet</div>') + '</div>'
    + '<div class="card"><h2>Emails</h2>' + (r.emails.length ? '<table><tbody>' + r.emails.map((m) => '<tr><td class="small">' + fmtDate(m.created_at) + '</td><td>' + esc(m.subject) + '</td><td class="small ' + (m.error ? 'err' : 'muted') + '">' + esc(m.error || 'Sent') + '</td></tr>').join('') + '</tbody></table>' : '<div class="muted small">No emails sent</div>') + '</div></div>';
  $('#x').onclick = closeLayer; wireCopy($('#dr'));
  document.querySelectorAll('#dr tr[data-a]').forEach((tr) => { tr.onclick = async () => { try { authModal((await api('authorization', { id: r.authorizations[+tr.dataset.a].id })).authorization); } catch (e) { alert(e.message); } }; });
  document.querySelectorAll('#dr tr[data-c]').forEach((tr) => { tr.onclick = () => { const c = r.claims[+tr.dataset.c]; const a = r.authorizations.find((x) => x.settlement_id === c.settlement_id); claimPanel(Object.assign({}, c, { profile: p, authorization: a || null })); }; });
}

// ---------- funnel ----------
async function funnel() {
  const days = cache.fd || 30;
  main('<h1>Funnel</h1><div class="sub">How far visitors get in the claim flow. Each row counts unique visitors who reached that step.</div><div class="empty">Loading...</div>');
  let r; try { r = await api('funnel', { days }); } catch (e) { return fail(e); }
  const steps = r.steps.filter((s) => STEP_LABEL[s.step] || /^q\d+$/.test(s.step));
  const top = Math.max(1, ...steps.map((s) => +s.visitors));
  const seg = '<div class="seg" role="group" aria-label="Time range">' + [7, 30, 90].map((d) => '<button data-d="' + d + '" class="' + (d === days ? 'on' : '') + '">' + d + ' days</button>').join('') + '</div>';
  let prev = null, worst = null;
  const rows = steps.map((s) => { const v = +s.visitors, drop = prev ? Math.max(0, 1 - v / prev) : 0; if (prev && (!worst || drop > worst.drop)) worst = { step: s.step, drop }; prev = v;
    return '<tr><td><b>' + esc(STEP_LABEL[s.step] || ('Question ' + (parseInt(s.step.slice(1), 10) + 1))) + '</b></td><td style="width:45%"><div class="bar"><span style="width:' + Math.round(v / top * 100) + '%"></span></div></td><td style="text-align:right;font-weight:800">' + v + '</td><td style="text-align:right" class="small ' + (drop > .3 ? 'err' : 'muted') + '">' + (drop ? '-' + Math.round(drop * 100) + '%' : '') + '</td><td style="text-align:right" class="small muted">' + Math.round(v / top * 100) + '% of start</td></tr>'; }).join('');
  main('<h1>Funnel</h1><div class="sub">How far visitors get in the claim flow. Each row counts unique visitors who reached that step.</div><div class="row" style="margin-bottom:12px;justify-content:space-between">' + seg + (worst ? '<span class="small"><b>Biggest drop:</b> ' + esc(STEP_LABEL[worst.step] || worst.step) + ' (' + Math.round(worst.drop * 100) + '% left before it)</span>' : '') + '</div>'
    + '<div class="card">' + (rows ? '<table><thead><tr><th>Step</th><th></th><th style="text-align:right">Visitors</th><th style="text-align:right">Drop</th><th></th></tr></thead><tbody>' + rows + '</tbody></table>' : '<div class="empty">No visits recorded yet. Tracking starts once this version is live.</div>') + '</div>');
  document.querySelectorAll('.seg button').forEach((b) => { b.onclick = () => { cache.fd = +b.dataset.d; funnel(); }; });
}

// ---------- settings ----------
async function settings() {
  main('<h1>Settings</h1><div class="sub">Switches that change what members see. Changes go live within a minute.</div><div class="empty">Loading...</div>');
  let r; try { r = await api('settings'); } catch (e) { return fail(e); }
  me.settings = r.settings;
  const on = r.settings.bank_connect === true, meta = r.settings.bank_connect_meta;
  main('<h1>Settings</h1><div class="sub">Switches that change what members see. Changes go live within a minute.</div>'
    + '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:18px"><div><h2 style="margin-bottom:6px">Bank connections</h2>'
    + '<div class="small muted" style="line-height:1.55;max-width:560px">When on, members see the "Never miss your payout updates" bank step after signup, the Connect a bank step in Finish your account, the bank row and Direct deposit in How you get paid, and you see Bank connected on each member. When off, all of that is hidden and members choose PayPal, Venmo, Zelle, a prepaid card or a check.</div>'
    + (meta ? '<div class="small muted" style="margin-top:8px">Last changed ' + fmtDate(meta.at) + ' by ' + esc(meta.by || '') + '</div>' : '') + '</div>'
    + '<button role="switch" aria-checked="' + on + '" aria-label="Bank connections" id="tgBank" style="flex:none;width:58px;height:32px;border-radius:99px;position:relative;transition:background .2s;background:' + (on ? '#12805C' : '#C9D3CD') + '"><span style="position:absolute;top:3px;left:' + (on ? '29px' : '3px') + ';width:26px;height:26px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 3px rgba(10,15,13,.25);transition:left .2s"></span></button></div>'
    + '<div class="row small" style="margin-top:10px"><span class="pill ' + (on ? 'p-approved' : 'p-ready') + '">' + (on ? 'On' : 'Off') + '</span><span id="smsg" class="muted" role="status"></span></div></div>');
  const con = r.settings.card_connect === true, cmeta = r.settings.card_connect_meta;
  $('#main').insertAdjacentHTML('beforeend', '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start;gap:18px"><div><h2 style="margin-bottom:6px">Card connections (Plaid)</h2>'
    + '<div class="small muted" style="line-height:1.55;max-width:560px">When on, members can connect a bank or card on Claim a refund and Subscription Manager. We review their charges, list their subscriptions and they can send them to the Refunds queue. Admins can always use it, even when off, for testing. Needs PLAID_CLIENT_ID, PLAID_SECRET, PLAID_ENV and PLAID_TOKEN_KEY in Vercel.</div>'
    + (cmeta ? '<div class="small muted" style="margin-top:8px">Last changed ' + fmtDate(cmeta.at) + ' by ' + esc(cmeta.by || '') + '</div>' : '') + '</div>'
    + '<button role="switch" aria-checked="' + con + '" aria-label="Card connections" id="tgCard" style="flex:none;width:58px;height:32px;border-radius:99px;position:relative;transition:background .2s;background:' + (con ? '#12805C' : '#C9D3CD') + '"><span style="position:absolute;top:3px;left:' + (con ? '29px' : '3px') + ';width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s"></span></button></div>'
    + '<div class="row small" style="margin-top:10px"><span class="pill ' + (con ? 'p-approved' : 'p-ready') + '">' + (con ? 'On' : 'Off') + '</span><span id="cmsg" class="muted" role="status"></span></div></div>');
  $('#tgCard').onclick = async () => {
    $('#cmsg').textContent = 'Saving...';
    try { const r2 = await api('setSetting', { key: 'card_connect', value: !con }); me.settings = r2.settings; settings(); }
    catch (e) { $('#cmsg').textContent = e.message; $('#cmsg').className = 'err'; }
  };
  $('#tgBank').onclick = async () => {
    $('#smsg').textContent = 'Saving...';
    try { const r2 = await api('setSetting', { key: 'bank_connect', value: !on }); me.settings = r2.settings; settings(); }
    catch (e) { $('#smsg').textContent = e.message; $('#smsg').className = 'err'; }
  };
}

// ---------- boot ----------
(async function boot() {
  if (!window.supabase) { $('#root').innerHTML = '<div class="login"><div class="box"><b>Could not load sign-in.</b><span class="muted">Check your connection and reload.</span></div></div>'; return; }
  let cfg; try { cfg = await (await fetch('/api/config')).json(); } catch (e) { cfg = {}; }
  if (!cfg.supabaseUrl) { $('#root').innerHTML = '<div class="login"><div class="box"><b>Database is not configured.</b></div></div>'; return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'cc-admin-auth' } });
  sb.auth.onAuthStateChange((ev, session) => { if (session) token = session.access_token; });
  const { data } = await sb.auth.getSession();
  if (data && data.session) start(data.session); else renderLogin();
})();
</script>
