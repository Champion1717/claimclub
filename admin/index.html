<script>/* Enter = the screen's main button (Nov 22 2026). Buttons marked data-enter are the "continue" action of their screen; on a keyboard,

function memSub(m) {
  if (!m) return '';
  if (m.bucket === 'trial') return 'ends ' + fmtDay(m.trial_ends_at).replace(/, \d{4}$/, '');
  if (m.status === 'ended' || m.status === 'cancelling') return m.renews_at ? (m.status === 'cancelling' ? 'ends ' : '') + fmtDay(m.renews_at).replace(/, \d{4}$/, '') : '';
  return m.kind === 'member' ? (PLAN_PRICE[m.plan] || '') : 'one time';
}
async function members() {
  const q = cache.mq || '', f = cache.mf || 'all';
  const top = head('Members', 'People on a paid plan or trial. Open a member for their info, claims, signed forms and payments.');
  main(top + '<div class="empty">Loading...</div>');
  let r; try { r = await api('users', { q, f }); } catch (e) { return fail(e); }
  const S = r.stats;
  const stats = '<div class="minis">' + mini('users', 'green', S.total, 'Members', S.new7 ? '+' + S.new7 + ' this week' : '') + mini('hourglass', 'amber', S.trial, 'In trial', S.trialEnding ? S.trialEnding + ' end this week' : '') + mini('badge-dollar-sign', 'green', S.paying, 'Paying') + mini('user-x', 'red', S.cancelled, 'Cancelled') + '</div>';
  const fb = (k, t) => '<button class="fch' + (f === k ? ' on' : '') + '" data-mf="' + k + '">' + t + '</button>';
  const bar = '<div class="bar2"><label class="sbox">' + lu('search', 16, '#8A968F') + '<input id="mq" placeholder="Search name, email or phone" value="' + esc(q) + '"></label>' + fb('all', 'All') + fb('trial', 'In trial') + fb('paying', 'Paying') + fb('cancelled', 'Cancelled') + fb('tofile', 'Has claims to file') + '</div>';
  const rows = r.users.length ? '<div class="tbl"><div class="th mm"><span>MEMBER</span><span>PLAN</span><span>OFFER</span><span>CLAIMS</span><span>TO FILE</span><span>PAID US</span><span>JOINED</span></div>'
    + r.users.map((u) => { const m = u.membership; return '<button class="tr mm" data-id="' + esc(u.id) + '"><span>' + whoCell(u.name || 'No name yet', (u.email || '') + (u.phone ? ' · ' + u.phone : '')) + '</span><span class="two">' + memChip(m) + '<span>' + esc(memSub(m)) + '</span></span><span><b>' + esc(m && m.flow ? m.flow.toUpperCase() : '-') + '</b></span><span><b>' + u.claims + '</b></span><span>' + (u.requested ? chip(u.requested + ' to file', 'amber') : '<span class="muted">None</span>') + '</span><span><b>$' + (u.paidCents / 100).toFixed(2).replace(/\.00$/, '') + '</b></span><span class="muted b7">' + fmtDay(m && m.started_at || u.created_at).replace(/, \d{4}$/, '') + '</span></button>'; }).join('') + '</div>'
      + (r.total > r.users.length ? '<div class="small muted" style="padding:10px 2px 0">Showing ' + r.users.length + ' of ' + r.total + '. Search to narrow it down.</div>' : '')
    : '<div class="empty">' + (q ? 'No members match that search.' : 'No members here yet.') + '</div>';
  main(top + stats + bar + '<div class="card list">' + rows + '</div>');
  const mq = $('#mq'); mq.onkeydown = (e) => { if (e.key === 'Enter') { cache.mq = mq.value.trim(); members(); } };
  document.querySelectorAll('[data-mf]').forEach((b) => { b.onclick = () => { cache.mf = b.dataset.mf; members(); }; });
  document.querySelectorAll('.tr.mm').forEach((tr) => { tr.onclick = () => go('member', tr.dataset.id); });
}
const memberPanel = (id) => go('member', id);

// ---------- one member (full page) ----------
async function memberPage(id) {
  main('<button class="back" id="toM">' + lu('chevron-left', 14) + 'Members</button><div class="empty">Loading...</div>');
  $('#toM').onclick = () => go('members');
  let r; try { r = await api('user', { id }); } catch (e) { return fail(e); }
  if (r.error) return fail(r.error);
  const p = r.profile, h = p.payout_handles || {}, m = r.membership, tab = cache.mtab || 'overview';
  const kv = (k, v, copy) => '<div class="fld"><span class="fk">' + k + '</span><span class="fv">' + (v ? esc(v) : '<span class="muted">Not provided</span>') + '</span>' + (v && copy !== false ? '<button class="cp" data-copy="' + esc(v) + '" title="Copy" aria-label="Copy ' + esc(k) + '">' + lu('copy', 14) + '</button>' : '<span></span>') + '</div>';
  const pays = [p.pay_default].concat((Array.isArray(h._on) ? h._on : []).filter((x) => x !== p.pay_default)).filter(Boolean).map((x, i) => x + (h[x] ? ' · ' + h[x] : '') + (i === 0 ? ' (preferred)' : '')).join(' | ');
  const paidUs = r.purchases.reduce((t, x) => t + (x.amount_cents || 0), 0), paidOut = r.claims.filter((c) => c.status === 'paid').reduce((t, c) => t + (c.paid_amount_cents || 0), 0);
  const toFile = r.claims.filter((c) => c.status === 'requested' || c.status === 'needs_info').length;
  const signedN = r.claims.filter((c) => r.authorizations.some((a) => a.settlement_id === c.settlement_id)).length;
  const planLine = m ? memChip(Object.assign({}, m, { bucket: m.trial_ends_at && Date.parse(m.trial_ends_at) > Date.now() && m.status !== 'ended' ? 'trial' : '' })) + (m.flow ? chip('Offer ' + m.flow.toUpperCase(), 'grey') : '') : chip('No membership', 'grey');
  const hd = '<button class="back" id="toM">' + lu('chevron-left', 14) + 'Members</button><div class="mhead">' + avatar(p.name || p.email, 56) + '<div class="mht"><div class="row" style="gap:10px;flex-wrap:wrap"><h1 style="margin:0">' + esc(p.name || 'No name yet') + '</h1>' + planLine + '</div><div class="sub" style="margin:4px 0 0">' + esc([p.email, p.phone, 'joined ' + fmtDay(p.created_at)].filter(Boolean).join(' · ')) + '</div></div>'
    + '<div class="phr"><a class="btn soft2" href="mailto:' + esc(p.email || '') + '">' + lu('mail', 16) + 'Email</a>' + (m && m.stripe_customer ? '<a class="btn soft2" target="_blank" rel="noopener" href="https://dashboard.stripe.com/customers/' + esc(m.stripe_customer) + '">' + lu('external-link', 16) + 'Open in Stripe</a>' : '') + '</div></div>';
  const stats = '<div class="minis">' + mini('folder-open', 'green', r.claims.length, 'Claims', toFile ? toFile + ' to file' : '') + mini('badge-dollar-sign', 'green', '$' + (paidUs / 100).toFixed(2).replace(/\.00$/, ''), 'Paid us', r.purchases.length + ' payment' + (r.purchases.length === 1 ? '' : 's')) + mini('hand-coins', 'green', '$' + (paidOut / 100).toFixed(2).replace(/\.00$/, ''), 'Paid out to them') + mini('pen-line', 'green', signedN + ' of ' + r.claims.length, 'Claims signed') + '</div>';
  const TB = [['overview', 'Overview'], ['claims', 'Claims · ' + r.claims.length], ['signed', 'Signed forms · ' + r.authorizations.length], ['payments', 'Payments · ' + r.purchases.length], ['emails', 'Emails · ' + r.emails.length], ['history', 'History']];
  const tabs = '<div class="seg" role="tablist">' + TB.map(([k, t]) => '<button data-mt="' + k + '" class="' + (k === tab ? 'on' : '') + '">' + t + '</button>').join('') + '</div>';
  const info = '<div class="card"><div class="ch"><b>Saved info</b></div>' + kv('Legal name', p.name) + kv('Email', p.email) + kv('Phone', p.phone) + kv('Date of birth', p.dob) + kv('Address', p.address) + kv('Past addresses', (p.past_addresses || []).join(' | ')) + kv('Payout', pays) + (me.settings && me.settings.bank_connect ? kv('Bank connected', p.bank_connected ? 'Yes' : 'No', false) : '') + kv('Email updates', p.email_receipts === false ? 'Off' : 'On', false)
    + (m ? kv('Membership', (m.kind === 'member' ? (PLAN_NAME[m.plan] || m.plan) + ' membership' : 'Filing fee') + ' · ' + m.status + (m.trial_ends_at ? ' · trial ends ' + fmtDay(m.trial_ends_at) : '') + (m.renews_at ? ' · renews ' + fmtDay(m.renews_at) : ''), false) : '') + '</div>';
  const claimRows = (lim) => r.claims.length ? r.claims.slice(0, lim || 999).map((c, i) => { const a = r.authorizations.find((x) => x.settlement_id === c.settlement_id); return '<button class="crow" data-c="' + i + '"><b class="ell">' + esc(setName(c.settlement_id)) + '</b><span>' + pill(c.status) + '</span><span class="muted b7">' + (c.status === 'paid' && c.paid_amount_cents ? 'Paid $' + (c.paid_amount_cents / 100).toFixed(2) : c.member_replied_at && c.status === 'requested' ? 'Member replied' : fmtDay(c.updated_at || c.created_at)) + '</span><span class="mono">' + esc(c.claim_ref || '') + '</span><span>' + (a ? '<span class="sg ok">' + lu('circle-check', 14) + 'Signed</span>' : '<span class="sg no">' + lu('circle-alert', 14) + 'No</span>') + '</span></button>'; }).join('') : '<div class="empty">No claims yet</div>';
  const hist = (lim) => r.events.length ? r.events.slice(0, lim || 999).map((e) => '<div class="fd"><span class="fi">' + lu(e.status === 'paid' ? 'hand-coins' : e.status === 'filed' ? 'file-check' : 'inbox', 15, '#12805C') + '</span><div><b>' + esc(setName(e.settlement_id)) + ' · ' + esc((STATUSES.find((x) => x[0] === e.status) || [e.status, e.status])[1]) + '</b><span>' + esc([e.actor, e.note, e.emailed ? 'emailed' : ''].filter(Boolean).join(' · ')) + '</span></div><span class="fa">' + fmtDay(e.created_at).replace(/, \d{4}$/, '') + '</span></div>').join('') : '<div class="empty">Nothing yet</div>';
  const claimsCard = (lim) => '<div class="card"><div class="ch"><b>Claims</b>' + (lim && r.claims.length > lim ? linkH('All ' + r.claims.length, 'data-mt="claims"') : '') + '</div>' + claimRows(lim) + '</div>';
  const signedCard = '<div class="card"><div class="ch"><b>Signed authorizations</b></div>' + (r.authorizations.length ? r.authorizations.map((a, i) => '<button class="crow sa" data-a="' + i + '"><span class="two"><b class="ell">' + esc(a.settlement_title || setName(a.settlement_id)) + '</b><span>' + esc(a.signer_name) + ' · ' + (a.method === 'blanket' ? 'agreed at checkout' : a.method === 'bulk' ? 'signed with other forms' : 'signed on its own') + '</span></span><span class="two"><b>' + fmtDate(a.created_at) + '</b><span>IP ' + esc(a.ip || '') + '</span></span><span class="lnk">View' + lu('chevron-right', 14) + '</span></button>').join('') : '<div class="empty">No signed forms</div>') + '</div>';
  const payCard = '<div class="card"><div class="ch"><b>Payments</b></div>' + (r.purchases.length ? r.purchases.map((x) => '<div class="crow pay"><b>' + esc(x.kind === 'member' ? (PLAN_NAME[x.plan] || x.plan || '') + ' membership' : 'Filing fee') + '</b><span class="muted b7">' + fmtDate(x.created_at) + '</span><span>' + (x.flow ? chip('Offer ' + x.flow.toUpperCase(), 'grey') : '') + '</span><b style="text-align:right">' + (x.amount_cents != null ? '$' + (x.amount_cents / 100).toFixed(2) : '') + '</b></div>').join('') : '<div class="empty">No payments</div>') + '</div>';
  const mailCard = '<div class="card"><div class="ch"><b>Emails</b></div>' + (r.emails.length ? r.emails.map((x) => '<div class="crow pay"><b class="ell">' + esc(x.subject) + '</b><span class="muted b7">' + fmtDate(x.created_at) + '</span><span></span><span class="' + (x.error ? 'err' : 'muted') + '" style="text-align:right">' + esc(x.error || 'Sent') + '</span></div>').join('') : '<div class="empty">No emails sent</div>') + '</div>';
  const body = tab === 'claims' ? claimsCard() : tab === 'signed' ? signedCard : tab === 'payments' ? payCard : tab === 'emails' ? mailCard : tab === 'history' ? '<div class="card"><div class="ch"><b>History</b></div>' + hist() + '</div>'
    : '<div class="mgrid">' + info + '<div class="mcol">' + claimsCard(6) + '<div class="card"><div class="ch"><b>Recent history</b>' + (r.events.length > 6 ? linkH('All', 'data-mt="history"') : '') + '</div>' + hist(6) + '</div></div></div>';
  main(hd + stats + tabs + body);
  $('#toM').onclick = () => go('members');
  document.querySelectorAll('[data-mt]').forEach((b) => { b.onclick = () => { cache.mtab = b.dataset.mt; memberPage(id); }; });
  wireCopy($('#main'));
  document.querySelectorAll('[data-a]').forEach((b) => { b.onclick = async () => { try { authModal((await api('authorization', { id: r.authorizations[+b.dataset.a].id })).authorization); } catch (e) { alert(e.message); } }; });
  document.querySelectorAll('[data-c]').forEach((b) => { b.onclick = () => { const c = r.claims[+b.dataset.c]; const a = r.authorizations.find((x) => x.settlement_id === c.settlement_id); claimPanel(Object.assign({}, c, { profile: p, authorization: a || null })); }; });
}

// ---------- admins card for Settings ----------
async function adminsCard() {
  const box = $('#admBox'); if (!box) return;
  const draw = (list, msg) => {
    box.innerHTML = '<div class="ch"><b>Admins</b><button class="lnk" id="admAdd">' + lu('plus', 14) + 'Add admin</button></div>'
      + list.map((a) => '<div class="arow">' + whoCell(a.name || a.email, a.name ? a.email : '') + '<span class="grow"></span>' + chip(a.role === 'owner' ? 'Owner' : 'Admin', a.role === 'owner' ? 'dark' : 'grey') + (a.role !== 'owner' && a.email !== me.email ? '<button class="cp" data-rm="' + esc(a.user_id) + '" title="Remove" aria-label="Remove ' + esc(a.email) + '">' + lu('trash-2', 14) + '</button>' : '') + '</div>').join('')
      + '<div id="admForm" hidden class="row" style="margin-top:10px;gap:8px"><input id="admEm" class="inp" type="email" placeholder="name@email.com"><button class="btn dark" id="admGo">Add</button></div><div id="admMsg" class="small" role="status" style="margin-top:6px">' + (msg || '') + '</div>';
    $('#admAdd').onclick = () => { $('#admForm').hidden = false; $('#admEm').focus(); };
    $('#admGo').onclick = async () => { const m = $('#admMsg'); m.className = 'small muted'; m.textContent = 'Adding...'; try { const r = await api('addAdmin', { email: $('#admEm').value }); draw(r.admins, 'Added. They can sign in at /admin with that email.'); } catch (e) { m.className = 'err'; m.textContent = e.message; } };
    $('#admEm').onkeydown = (e) => { if (e.key === 'Enter') $('#admGo').click(); };
    document.querySelectorAll('[data-rm]').forEach((b) => { b.onclick = async () => { if (!confirm('Remove this admin?')) return; try { const r = await api('removeAdmin', { user_id: b.dataset.rm }); draw(r.admins); } catch (e) { alert(e.message); } }; });
  };
  try { const r = await api('admins'); draw(r.admins); } catch (e) { box.innerHTML = '<div class="ch"><b>Admins</b></div><div class="err">' + esc(e.message) + '</div>'; }
}

// ---------- boot ----------
(async function boot() {
  if (!window.supabase) { $('#root').innerHTML = '<div class="login"><div class="box"><b>Could not load sign-in.</b><span class="muted">Check your connection and reload.</span></div></div>'; return; }
  let cfg; try { cfg = await (await fetch('/api/config')).json(); } catch (e) { cfg = {}; }
  if (!cfg.supabaseUrl) { $('#root').innerHTML = '<div class="login"><div class="box"><b>Database is not configured.</b></div></div>'; return; }
  sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey, { auth: { persistSession: true, autoRefreshToken: true, storageKey: 'cc-admin-auth' } });
  sb.auth.onAuthStateChange((ev, session) => { if (session) token = session.access_token; });
  const { data } = await sb.auth.getSession();
  if (data && data.session) start(data.session); else renderLogin();
})();
</script>
