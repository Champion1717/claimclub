  // Mobile How it works: the section stays pinned (sticky) while you scroll through it; scroll position picks the step (3 steps), each step's tap animation loops by itself.
  howMob() {
    const w = document.querySelector('.howStory'); if (!w || w._hm) return; w._hm = true;
    const bars = Array.from(w.querySelectorAll('.hsb')); let raf = 0, vis = false, cur = -1;
    const tick = () => {
      raf = 0; if (!vis) return;
      const r = w.getBoundingClientRect(), vh = window.innerHeight || document.documentElement.clientHeight;
      const total = Math.max(1, r.height - vh), p = Math.min(1, Math.max(0, -r.top / total));
      const step = Math.min(2, Math.floor(p * 3)), within = Math.min(1, p * 3 - step);
      if (step !== cur) { cur = step; w.setAttribute('data-s', step); }
      // Step 2: the File buttons get tapped one by one as you scroll. Step 3: payout notifications stack up one by one.
