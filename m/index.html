body{margin:0;background:#FFFFFF}

@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

.c1{animation:chip 4s ease-in-out infinite}
@keyframes nin{from{opacity:0;transform:translateY(-16px)}to{opacity:1;transform:none}}.n1{animation:nin .6s ease .2s both}.n2{animation:nin .6s ease .45s both}.n3{animation:nin .6s ease .7s both}

.spin{animation:orbit 60s linear infinite}.spin img{animation:counter 60s linear infinite}
@keyframes fan1{from{opacity:0;translate:0 40px}to{opacity:1;translate:0 0}}
.s1{animation:fan1 .8s cubic-bezier(.2,.8,.2,1) .3s both}.s2{animation:fan1 .8s cubic-bezier(.2,.8,.2,1) .45s both}.s3{animation:fan1 .8s cubic-bezier(.2,.8,.2,1) .6s both}

@media (prefers-reduced-motion: reduce){.spin,.spin img,.s1,.s2,.s3,.pulse,.marq,.orb1,.orb2,.u1,.u2,.u3,.pl,.pr,.c1,.c2,.rv{animation:none !important}}

.ink{stroke-dasharray:400;stroke-dashoffset:400;animation:inkdraw 1.2s ease forwards;animation-timeline:view();animation-range:entry 40% cover 55%}
@supports not (animation-timeline: view()){.ink{animation:inkdraw 1.2s ease .3s forwards}}

  daysLeft(dl) {
    if (!dl) return 999;
    const d = new Date(dl + 'T23:59:00');
    return Math.max(0, Math.ceil((d - new Date()) / 86400000));
  }
  fmtDate(dl) {
    if (!dl) return 'No deadline';
    const m = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const [y, mo, da] = dl.split('-').map(Number);
    return m[mo - 1] + ' ' + da + ', ' + y;
  }
