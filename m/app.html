<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Claimclub · Your claims</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.ico" sizes="32x32"><link rel="apple-touch-icon" href="/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Mrs+Saint+Delafield&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#12805C}a:hover{color:#0F3B2E}
button{font-family:inherit;cursor:pointer;border:0}
input:focus{outline:2px solid #12805C;outline-offset:1px}
.scroll::-webkit-scrollbar{width:8px}.scroll::-webkit-scrollbar-thumb{background:#DDE5E0;border-radius:9px}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.toast{animation:tin .25s ease both}

:root{color-scheme:light}
input,textarea,select{background-color:#FFFFFF;color:#0A0F0D}
input:-webkit-autofill{-webkit-box-shadow:0 0 0 40px #FFFFFF inset}
/* clean scrollbars */
::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:6px;height:6px;background:transparent}
::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{background:rgba(10,15,13,.16);border-radius:99px;border:0}
::-webkit-scrollbar-thumb:hover,.scroll::-webkit-scrollbar-thumb:hover{background:rgba(10,15,13,.3)}
::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar:horizontal,.scroll::-webkit-scrollbar:horizontal{height:0;display:none}
@supports (-moz-appearance:none){*{scrollbar-width:thin;scrollbar-color:rgba(10,15,13,.18) transparent}}
</style>
<style>html,body{margin:0}sc-if,sc-for{display:contents}</style></head><body><template id="tpl">
<div style="position: relative; width: 100%; height: 100vh; min-height: 640px; max-width: 520px; margin: 0 auto; box-sizing: border-box; background: #F3F6F4; color: #0A0F0D; font-family: Manrope, sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="flex: none; display: flex; align-items: center; justify-content: space-between; padding: 14px 18px 10px; background: #F3F6F4">
    <div style="display: flex; align-items: center; gap: 8px"><svg width="24" height="24" viewBox="0 0 100 100" aria-hidden="true"><path fill="#0F3B2E" d="M81.4 83.6A46 46 0 0 1 51.6 96.0L51.2 83.0A33 33 0 0 0 72.5 74.1Z"></path><path fill="#0F3B2E" d="M48.4 96.0A46 46 0 0 1 18.6 83.6L27.5 74.1A33 33 0 0 0 48.8 83.0Z"></path><path fill="#0F3B2E" d="M16.4 81.4A46 46 0 0 1 4.0 51.6L17.0 51.2A33 33 0 0 0 25.9 72.5Z"></path><path fill="#0F3B2E" d="M4.0 48.4A46 46 0 0 1 16.4 18.6L25.9 27.5A33 33 0 0 0 17.0 48.8Z"></path><path fill="#0F3B2E" d="M18.6 16.4A46 46 0 0 1 48.4 4.0L48.8 17.0A33 33 0 0 0 27.5 25.9Z"></path><path fill="#3DDC97" d="M51.6 4.0A46 46 0 0 1 81.4 16.4L72.5 25.9A33 33 0 0 0 51.2 17.0Z"></path></svg><span style="font-size: 18px; font-weight: 800; letter-spacing: -0.5px; color: #0F3B2E">claim<span style="font-weight: 500">club</span><span style="font-size: 0.72em; font-weight: 600; color: #000000; margin-left: -0.06em">.io</span></span></div>
    <button onClick="{{ goSettings }}" aria-label="Account" style="width: 36px; height: 36px; border-radius: 50%; background: #0F3B2E; color: #FFFFFF; font-size: 13px; font-weight: 800">AR</button>
  </header>
  <main class="scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 4px 18px 20px">
    <sc-if value="{{ isDash }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 14px">
        <sc-if value="{{ showLocalBanner }}" hint-placeholder-val="{{ false }}"><div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DDE5E0"><span style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: #E3ECE8; color: #0F3B2E; display: flex; align-items: center; justify-content: center"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg></span><span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800">{{ localBannerT }}</span><span style="font-size: 12px; color: #5B6862">State and city settlements near you</span></span><button onClick="{{ viewNear }}" style="min-height: 36px; padding: 0 14px; border-radius: 99px; background: #0F3B2E; color: #FFFFFF; font-size: 13px; font-weight: 800">View</button><button onClick="{{ dismissLocal }}" aria-label="Dismiss" style="width: 28px; height: 28px; flex: none; background: transparent; color: #8A968F; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18 M6 6l12 12"></path></svg></button></div></sc-if>
        <sc-if value="{{ showBankBanner }}" hint-placeholder-val="{{ true }}"><div role="status" style="display: flex; align-items: center; gap: 10px; padding: 12px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DDE5E0"><span style="width: 34px; height: 34px; flex: none; border-radius: 10px; background: #FFF4D6; color: #6B4600; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9 M10.3 21a1.94 1.94 0 0 0 3.4 0"></path></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 14px; font-weight: 800">Get payout alerts</span><span style="font-size: 12px; color: #5B6862">Connect your bank. Read-only.</span></span><button onClick="{{ connectBank }}" style="min-height: 36px; padding: 0 14px; border-radius: 99px; background: #0F3B2E; color: #FFFFFF; font-size: 13px; font-weight: 800">Connect</button><button onClick="{{ dismissBank }}" aria-label="Dismiss" style="width: 28px; height: 28px; flex: none; background: transparent; color: #8A968F; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18 M6 6l12 12"></path></svg></button></div></sc-if>
        <div style="border-radius: 22px; padding: 18px; background: linear-gradient(140deg, #0F3B2E, #12805C); color: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 12px; font-weight: 800; letter-spacing: 1px; opacity: .8">YOUR ESTIMATE</span>
          <span style="font-size: 38px; font-weight: 800; letter-spacing: -1.4px; line-height: 1">{{ estLabel }}</span>
          <span style="font-size: 13px; opacity: .85">from {{ matchCount }} matched claims</span>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding-top: 8px">
            <div style="background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px"><div style="font-size: 18px; font-weight: 800">{{ readyCount }}</div><div style="font-size: 11px; opacity: .85">Ready to sign</div></div>
            <div style="background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px"><div style="font-size: 18px; font-weight: 800">{{ needsCount }}</div><div style="font-size: 11px; opacity: .85">Need info</div></div>
            <div style="background: rgba(255,255,255,.12); border-radius: 12px; padding: 8px 10px"><div style="font-size: 18px; font-weight: 800">{{ filedCount }}</div><div style="font-size: 11px; opacity: .85">Filed</div></div>
          </div>
        </div>
        <sc-if value="{{ hasActions }}" hint-placeholder-val="{{ true }}"><button onClick="{{ signAll }}" style="min-height: 52px; border-radius: 999px; background: #3DDC97; color: #0A0F0D; font-size: 16px; font-weight: 800">Sign {{ readyCount }} claims ready to file</button></sc-if>
        <div style="background: #FFFFFF; border-radius: 20px; padding: 4px 14px; border: 1px solid #DDE5E0">
          <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0 4px"><span style="font-size: 16px; font-weight: 800">Your claims</span><span style="font-size: 12px; font-weight: 700; color: #5B6862">{{ matchCount }} matched</span></div>
          <sc-for list="{{ mineAll }}" as="r" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid #EEF2EF">
            <sc-if value="{{ r.hasLogo }}" hint-placeholder-val="{{ true }}"><img src="{{ r.logo }}" alt="" style="width: 38px; height: 38px; flex: none; border-radius: 10px; object-fit: contain; background: #FFFFFF; box-shadow: inset 0 0 0 1px #DDE5E0; padding: 5px; box-sizing: border-box"></sc-if>
            <sc-if value="{{ r.noLogo }}" hint-placeholder-val="{{ false }}"><div style="{{ r.tileStyle }}; width: 38px; height: 38px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800">{{ r.initial }}</div></sc-if>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.co }}</span><span style="display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: #5B6862"><span style="{{ r.stStyle }}; padding: 2px 7px; border-radius: 99px; font-size: 11px; font-weight: 800">{{ r.stLabel }}</span>{{ r.days }}</span><span style="display: flex; gap: 3px; margin-top: 2px; max-width: 160px"><sc-for list="{{ r.segs }}" as="g" hint-placeholder-count="4"><span style="{{ g.style }}"></span></sc-for></span><span style="font-size: 11.5px; line-height: 1.35; color: #43504A; white-space: normal">{{ r.waiting }}</span></div>
            <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-size: 14px; font-weight: 800">{{ r.amt }}</span>
              <sc-if value="{{ r.canSign }}" hint-placeholder-val="{{ true }}"><button onClick="{{ r.sign }}" style="min-height: 30px; padding: 0 12px; border-radius: 99px; background: #0F3B2E; color: #FFFFFF; font-size: 12px; font-weight: 800">Sign</button></sc-if>
              <sc-if value="{{ r.canAdd }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.add }}" style="min-height: 30px; padding: 0 12px; border-radius: 99px; background: #FFFFFF; color: #0F3B2E; box-shadow: inset 0 0 0 1.5px #0F3B2E; font-size: 12px; font-weight: 800">Add info</button></sc-if>
              <sc-if value="{{ r.canSite }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.site }}" style="min-height: 30px; padding: 0 12px; border-radius: 99px; background: #FFF4D6; color: #6B4600; font-size: 12px; font-weight: 800">Open site</button></sc-if>
              <sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; color: #17603F">{{ r.doneLabel }}</span></sc-if>
            </div>
          </div>
          </sc-for>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; justify-content: space-between; align-items: baseline"><h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.7px">Settlements</h1><span style="font-size: 13px; font-weight: 700; color: #5B6862">{{ listCount }}</span></div>
        <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center"><div style="display: flex; gap: 8px; flex-wrap: wrap"><button onClick="{{ pickAll }}" style="{{ scopeAll }}">{{ scopeAllLabel }}</button><button onClick="{{ pickNear }}" style="{{ scopeNear }}; display: inline-flex; align-items: center; gap: 6px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>{{ scopeNearLabel }}</button></div><div style="position: relative; flex: 1 1 220px; "><label for="setqM" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search settlements</label><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5B6862" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="position: absolute; left: 14px; top: 50%; transform: translateY(-50%)"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg><input id="setqM" type="search" placeholder="Search company, state or city" value="{{ q }}" onChange="{{ onQ }}" style="width: 100%; box-sizing: border-box; height: 44px; border-radius: 99px; border: 1px solid #DDE5E0; padding: 0 16px 0 40px; font-size: 14px; font-family: inherit; background: #FFFFFF; color: #0A0F0D"></div></div>
        <sc-if value="{{ nearEmpty }}" hint-placeholder-val="{{ false }}"><div style="padding: 18px; border-radius: 18px; background: #FFFFFF; border: 1px dashed #C3CEC8; font-size: 14px; color: #43504A">No local settlements in {{ myState }} right now. We scan every week and will alert you when one opens near you.</div></sc-if>
        <div class="scroll" style="display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin: 0 -18px; padding-left: 18px; padding-right: 18px"><sc-for list="{{ filters }}" as="f" hint-placeholder-count="6"><button onClick="{{ f.pick }}" style="{{ f.style }}">{{ f.label }}</button></sc-for></div>
        <div style="background: #FFFFFF; border-radius: 20px; padding: 0 14px; border: 1px solid #DDE5E0">
          <sc-for list="{{ list }}" as="r" hint-placeholder-count="8">
          <div style="display: flex; align-items: center; gap: 11px; padding: 12px 0; border-bottom: 1px solid #EEF2EF">
            <sc-if value="{{ r.hasLogo }}" hint-placeholder-val="{{ true }}"><img src="{{ r.logo }}" alt="" style="width: 38px; height: 38px; flex: none; border-radius: 10px; object-fit: contain; background: #FFFFFF; box-shadow: inset 0 0 0 1px #DDE5E0; padding: 5px; box-sizing: border-box"></sc-if>
            <sc-if value="{{ r.noLogo }}" hint-placeholder-val="{{ false }}"><div style="{{ r.tileStyle }}; width: 38px; height: 38px; flex: none; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 800">{{ r.initial }}</div></sc-if>
            <div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 15px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ r.co }}</span><sc-if value="{{ r.isLocal }}" hint-placeholder-val="{{ false }}"><span style="display: inline-flex; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 800; padding: 3px 7px; border-radius: 99px; background: #E3ECE8; color: #0F3B2E; white-space: nowrap; max-width: 100%; align-self: flex-start; overflow: hidden; text-overflow: ellipsis">{{ r.area }}</span></sc-if><span style="display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 600; color: #5B6862"><span style="{{ r.stStyle }}; padding: 2px 7px; border-radius: 99px; font-size: 11px; font-weight: 800">{{ r.stLabel }}</span>{{ r.days }}</span><span style="display: flex; gap: 3px; margin-top: 2px; max-width: 160px"><sc-for list="{{ r.segs }}" as="g" hint-placeholder-count="4"><span style="{{ g.style }}"></span></sc-for></span><span style="font-size: 11.5px; line-height: 1.35; color: #43504A; white-space: normal">{{ r.waiting }}</span></div>
            <div style="flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 4px"><span style="font-size: 14px; font-weight: 800">{{ r.amt }}</span>
              <sc-if value="{{ r.canSign }}" hint-placeholder-val="{{ true }}"><button onClick="{{ r.sign }}" style="min-height: 30px; padding: 0 12px; border-radius: 99px; background: #0F3B2E; color: #FFFFFF; font-size: 12px; font-weight: 800">Sign</button></sc-if>
              <sc-if value="{{ r.canAdd }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.add }}" style="min-height: 30px; padding: 0 12px; border-radius: 99px; background: #FFFFFF; color: #0F3B2E; box-shadow: inset 0 0 0 1.5px #0F3B2E; font-size: 12px; font-weight: 800">Add info</button></sc-if>
              <sc-if value="{{ r.canSite }}" hint-placeholder-val="{{ false }}"><button onClick="{{ r.site }}" style="min-height: 30px; padding: 0 12px; border-radius: 99px; background: #FFF4D6; color: #6B4600; font-size: 12px; font-weight: 800">Open site</button></sc-if>
              <sc-if value="{{ r.done }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12px; font-weight: 700; color: #17603F">{{ r.doneLabel }}</span></sc-if>
            </div>
          </div>
          </sc-for>
        </div>
        <sc-if value="{{ locked }}" hint-placeholder-val="{{ false }}"><div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px; padding: 16px; border-radius: 20px; background: #0F3B2E; color: #FFFFFF"><span style="width: 44px; height: 44px; flex: none; border-radius: 12px; background: rgba(255,255,255,.12); color: #3DDC97; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg></span><span style="flex: 1 1 240px; display: flex; flex-direction: column; gap: 3px"><span style="font-size: 16px; font-weight: 800">+ {{ lockedN }} more open settlements, plus {{ localN }} local ones</span><span style="font-size: 13px; line-height: 1.5; color: #B9CCC2">Members see every open settlement and get local scans for state and city settlements near you. First filing free.</span></span><button onClick="{{ joinMember }}" style="min-height: 44px; padding: 0 20px; border-radius: 99px; background: #3DDC97; color: #0A0F0D; font-size: 14px; font-weight: 800">Join from $7.99/mo</button></div></sc-if>
      </div>
    </sc-if>
    <sc-if value="{{ isSettings }}" hint-placeholder-val="{{ false }}">
      <h1 style="margin: 0 0 4px; font-size: 26px; font-weight: 800; letter-spacing: -0.7px">Settings</h1>
      <div style="display: flex; flex-direction: column">
  <sc-for list="{{ settingRows }}" as="r" hint-placeholder-count="7">
    <button onClick="{{ r.act }}" role="{{ r.role }}" style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 2px; background: transparent; text-align: left; color: #0A0F0D; font-size: 16px; font-weight: 700">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{ r.icon }}"></path></svg>
      <span style="flex-grow: 1">{{ r.label }}</span>
      <sc-if value="{{ r.isToggle }}" hint-placeholder-val="{{ true }}"><span style="{{ r.track }}"><span style="{{ r.knob }}"></span></span></sc-if>
      <sc-if value="{{ r.isNav }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></sc-if>
      <sc-if value="{{ r.isExt }}" hint-placeholder-val="{{ false }}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h6v6 M10 14 21 3 M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path></svg></sc-if>
    </button>
  </sc-for>
  <div style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 2px; color: #0A0F0D; font-size: 16px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M3 21h18 M3 10h18 M5 6l7-3 7 3 M4 10v11 M20 10v11 M8 14v3 M12 14v3 M16 14v3"></path></svg>
    <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 1px"><span>Bank account</span><sc-if value="{{ bankLinked }}" hint-placeholder-val="{{ false }}"><span style="font-size: 12.5px; font-weight: 700; color: #17603F">Chase ••4417 · payout alerts on</span></sc-if><sc-if value="{{ bankNot }}" hint-placeholder-val="{{ true }}"><span style="font-size: 12.5px; font-weight: 700; color: #6B4600">Not connected</span></sc-if></span>
    <sc-if value="{{ bankNot }}" hint-placeholder-val="{{ true }}"><button onClick="{{ connectBank }}" style="min-height: 34px; padding: 0 14px; border-radius: 99px; background: #0F3B2E; color: #FFFFFF; font-size: 13px; font-weight: 800">Connect</button></sc-if>
    <sc-if value="{{ bankLinked }}" hint-placeholder-val="{{ false }}"><button onClick="{{ disconnectBank }}" style="min-height: 34px; padding: 0 12px; border-radius: 99px; background: #FFFFFF; color: #B8333A; font-size: 13px; font-weight: 800; box-shadow: inset 0 0 0 1px #F2C9CC">Disconnect</button></sc-if>
  </div>
  <button onClick="{{ toggleSub }}" aria-expanded="{{ subOpen }}" style="display: flex; align-items: center; gap: 14px; min-height: 58px; padding: 0 2px; background: transparent; text-align: left; color: #0A0F0D; font-size: 16px; font-weight: 700">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="M4 5h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z M2 10h20"></path></svg>
    <span style="flex-grow: 1">Membership</span>
    <sc-if value="{{ subOpen }}" hint-placeholder-val="{{ true }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 15l-6-6-6 6"></path></svg></sc-if>
    <sc-if value="{{ subClosed }}" hint-placeholder-val="{{ false }}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></sc-if>
  </button>
